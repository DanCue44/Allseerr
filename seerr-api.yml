  /overrideRule:
    get:
      summary: Get override rules
      description: Returns a list of all override rules with their conditions and settings
      tags:
        - overriderule
      responses:
        '200':
          description: Override rules returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OverrideRule'
    post:
      summary: Create override rule
      description: Creates a new Override Rule from the request body.
      tags:
        - overriderule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRule'
      responses:
        '200':
          description: 'Values were successfully created'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OverrideRule'
  /overrideRule/{ruleId}:
    put:
      summary: Update override rule
      description: Updates an Override Rule from the request body.
      tags:
        - overriderule
      parameters:
        - in: path
          name: ruleId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRule'
      responses:
        '200':
          description: 'Values were successfully updated'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OverrideRule'
    delete:
      summary: Delete override rule by ID
      description: Deletes the override rule with the provided ruleId.
      tags:
        - overriderule
      parameters:
        - in: path
          name: ruleId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Override rule successfully deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideRule'
  /overrideRule/advancedRequest:
    post:
      summary: Advanced override rule request
      description: Processes an advanced override rule request.
      tags:
        - overriderule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mediaType
              properties:
                mediaType:
                  type: string
                tmdbId:
                  type: number
                  example: 1
                  description: Required for movies and series, music rules only match on users
                is4k:
                  type: boolean
                  example: false
                requestId:
                  type: number
                  nullable: true
                requestUser:
                  type: number
                  nullable: true
                tags:
                  type: array
                  items:
                    type: number
                  nullable: true
                serviceId:
                  type: number
                  nullable: true
      responses:
        '200':
          description: Advanced override rule request processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  rootFolder:
                    type: string
                    nullable: true
                  profileId:
                    type: number
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: number
                    nullable: true
        '403':
          description: User does not have permission to modify the request user
        '404':
          description: User, media or request not found
        '500':
          description: Unable to evaluate override rules

security:
  - cookieAuth: []
  - apiKey: []
