        - `ready`: they have an account, shown with its `username`
        - `available`: an admin or the default for Plex users gave them the app, but there is no account yet
        - `notGranted`: they do not have access
        - `requested`: they asked an admin for access
        - `error`: the account could not be made, setting it up again tries once more
