  /search:
    get:
      summary: Search for movies, TV shows, people, music or books
      description: |
        Returns a list of movies, TV shows, or people a JSON object. When a Lidarr server is configured, the first page also holds matching albums and artists from MusicBrainz, and when LazyLibrarian is configured, matching books and authors from OpenLibrary.

        With `type=music` only albums and artists are returned, and with `type=book` only books, plus authors on the first page.
      tags:
        - search
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
            example: 'Mulan'
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
        - in: query
          name: type
          schema:
            type: string
            enum: [all, music, book, comic]
            default: all
        - in: query
          name: language
          schema:
            type: string
            example: en
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 20
                  totalResults:
                    type: number
                    example: 200
                  results:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/MovieResult'
                        - $ref: '#/components/schemas/TvResult'
                        - $ref: '#/components/schemas/PersonResult'
                        - $ref: '#/components/schemas/AlbumResult'
                        - $ref: '#/components/schemas/ArtistResult'
                        - $ref: '#/components/schemas/BookResult'
                        - $ref: '#/components/schemas/AuthorResult'
