    MediaRequest:
      type: object
      properties:
        id:
          type: number
          example: 123
          readOnly: true
        status:
          type: number
          example: 0
          description: Status of the request. 1 = PENDING APPROVAL, 2 = APPROVED, 3 = DECLINED
          readOnly: true
        media:
          $ref: '#/components/schemas/MediaInfo'
        createdAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        updatedAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        requestedBy:
          $ref: '#/components/schemas/User'
        modifiedBy:
          anyOf:
            - $ref: '#/components/schemas/User'
            - type: string
              nullable: true
        is4k:
          type: boolean
          example: false
        isAudiobook:
          type: boolean
          example: false
          description: Books only. True for an audiobook request, false for an ebook request.
        language:
          type: string
          nullable: true
          enum:
            [
              en,
              es,
              fr,
              de,
              it,
              pt,
              nl,
              sv,
              da,
              'no',
              fi,
              pl,
              ru,
              ja,
              zh,
              ko,
              any,
              null,
            ]
          example: en
          description: Books only. ISO 639-1 code of the language the book is requested in, or `any`. Null for requests made before languages could be chosen, which use the requester's language.
        serverId:
          type: number
        profileId:
          type: number
        rootFolder:
          type: string
        ignoreQuota:
          type: boolean
          example: false
          description: If true, this request will not count against the user's quota. Requires MANAGE_REQUESTS permission.
        declineReason:
          type: string
          nullable: true
          example: 'Already streaming on Netflix'
        recording:
          type: string
          nullable: true
          enum: [unabridged, abridged, narrator, edition, null]
          description: Audiobooks on Talearr only. Set when the request is for another recording of an audiobook that is already available, such as the unabridged reading. The request is sent to Talearr's recordings route and is completed once that recording has files, not by the book's audiobook status.
        recordingNarrator:
          type: string
          nullable: true
          description: Recording requests only. The narrator asked for, or the narrator of the recording Talearr picked.
          example: Scott Brick
        recordingEditionId:
          type: number
          nullable: true
          description: Recording requests of kind `edition` only. Talearr's id of the edition.
        recordingBookId:
          type: number
          nullable: true
          description: Recording requests only. Talearr's book id of the recording once Talearr has added it.
        audiobookVersion:
          type: string
          nullable: true
          enum: [unabridged, abridged, both, null]
          description: Audiobooks on Talearr only, with Audiobook Versions set to `requester`. The version the requester picked. Null on every other request, which follows the setting.
        comicVolumes:
          type: array
          nullable: true
          items:
            type: number
          example: [1, 2, 3, 7]
          description: Comics only. The volume numbers asked for, sorted. Null for a request of the whole series. Once approved, Talearr adds a new series with only these volumes monitored, or wants them in a series it has; an older Talearr monitors every volume instead. The request is completed once Talearr has every volume it lists.
        monitorMode:
          type: string
          nullable: true
          enum: [seasons, future, current, null]
          description: Series only. `future` requests monitor only the episodes that have not aired yet, without searching for aired ones. `current` requests keep only the airing season. Once a new season has an aired episode with a file, the Sonarr scan schedules the older seasons for deletion after a notice period, and seasons in `preexistingSeasons` are kept unless an admin approves deleting them.
        preexistingSeasons:
          type: array
          nullable: true
          items:
            type: number
          example: [1, 2]
          description: Current season requests only. Seasons that were already available when the request was made. Null for older requests, which keeps every older season.
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/SeasonRequest'
      required:
        - id
        - status
    SeasonRequest:
      type: object
      properties:
        id:
          type: number
          example: 1
          readOnly: true
        seasonNumber:
          type: number
          example: 2
        status:
          type: number
          example: 1
          description: Status of the season request. 1 = PENDING APPROVAL, 2 = APPROVED, 3 = DECLINED, 4 = FAILED, 5 = COMPLETED
          readOnly: true
        episodes:
          type: array
          nullable: true
          items:
            type: number
          example: [3, 5]
          description: Requested episode numbers, or null when the whole season is requested
        createdAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        updatedAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
