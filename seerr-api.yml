  /branding/logo:
    get:
      summary: Get the application logo
      description: Returns the uploaded application logo, or redirects to the bundled logo when none has been uploaded.
      security: []
      tags:
        - settings
      parameters:
        - in: query
          name: v
          required: false
          description: Logo version, used to cache the response
          schema:
            type: string
            example: 3f2a9c81d4e7
      responses:
        '200':
          description: The uploaded logo
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '302':
          description: No logo has been uploaded; redirects to the bundled logo
  /branding/icon/{name}:
    get:
      summary: Get an application icon
      description: Returns an icon generated from the uploaded application logo, or redirects to the bundled icon of the same name when none has been uploaded.
      security: []
      tags:
        - settings
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            enum:
              - favicon-16x16.png
              - favicon-32x32.png
              - apple-touch-icon.png
              - android-chrome-192x192.png
              - android-chrome-512x512.png
              - android-chrome-192x192_maskable.png
              - android-chrome-512x512_maskable.png
              - favicon.ico
        - in: query
          name: v
          required: false
          description: Logo version, used to cache the response
          schema:
            type: string
            example: 3f2a9c81d4e7
      responses:
        '200':
          description: The generated icon
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/x-icon:
              schema:
                type: string
                format: binary
        '302':
          description: No logo has been uploaded; redirects to the bundled icon
  /branding/splash/{name}:
    get:
      summary: Get an iOS launch screen
      description: Returns a launch screen made from the uploaded application logo, or redirects to the bundled launch screen of the same name when none has been uploaded.
      security: []
      tags:
        - settings
      parameters:
        - in: path
          name: name
          required: true
          description: apple-splash-<width>-<height>.jpg, in one of the sizes iOS uses
          schema:
            type: string
            pattern: '^apple-splash-[0-9]+-[0-9]+\.jpg$'
            example: apple-splash-1170-2532.jpg
        - in: query
          name: v
          required: false
          description: Logo version, used to cache the response
          schema:
            type: string
            example: 3f2a9c81d4e7
      responses:
        '200':
          description: The launch screen
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '302':
          description: No logo has been uploaded; redirects to the bundled launch screen
        '404':
          description: Not a launch screen size iOS uses
