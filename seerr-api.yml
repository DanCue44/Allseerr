  /person/{personId}/combined_credits:
    get:
      summary: Get combined credits
      description: Returns the person's combined credits based on the provided personId in a JSON object.
      tags:
        - person
      parameters:
        - in: path
          name: personId
          required: true
          schema:
            type: number
            example: 287
        - in: query
          name: language
          schema:
            type: string
            example: en
      responses:
        '200':
          description: Returned combined credits
          content:
            application/json:
              schema:
                type: object
                properties:
                  cast:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditCast'
                  crew:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditCrew'
                  id:
                    type: number
  /library:
    get:
      summary: Browse the library
      description: |
        Returns movies or series whose status (or 4K status) is available or partially available, with titles and posters from TMDB. Sorting by date added only looks up the requested page on TMDB; every other sort and the genre filter use cached metadata for the whole library.
      tags:
        - library
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - mediaAdded.desc
              - mediaAdded.asc
              - title.asc
              - title.desc
              - releaseDate.desc
              - releaseDate.asc
              - rating.desc
              - rating.asc
            default: mediaAdded.desc
        - in: query
          name: genre
          description: Comma separated TMDB genre ids; titles must have all of them.
          schema:
            type: string
            example: '18'
      responses:
        '200':
          description: Library titles returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 20
                  totalResults:
                    type: number
                    example: 200
                  results:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/MovieResult'
                        - $ref: '#/components/schemas/TvResult'
  /library/collections:
    get:
      summary: Browse library collections
      description: |
        Returns the TMDB collections that have at least one movie available or requested on the server, sorted by name.
      tags:
        - library
      parameters:
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
      responses:
        '200':
          description: Library collections returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 1
                  totalResults:
                    type: number
                    example: 5
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 10
                        mediaType:
                          type: string
                          example: collection
                        title:
                          type: string
                          example: Star Wars Collection
                        posterPath:
                          type: string
                        backdropPath:
                          type: string
  /media:
    get:
      summary: Get media
      description: Returns all media (can be filtered and limited) in a JSON object.
      tags:
        - media
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 20
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: filter
          schema:
            type: string
            nullable: true
            enum:
              [
                all,
                available,
                partial,
                allavailable,
                processing,
                pending,
                deleted,
              ]
        - in: query
          name: sort
          description: |
            `title`, `creator` (album artist or book author) and `releaseDate` only apply with
            `mediaType` music or book, and sort on what Lidarr or Chaptarr know about each title.
            Titles neither knows go last.
          schema:
            type: string
            enum: [added, modified, mediaAdded, title, creator, releaseDate]
            default: added
        - in: query
          name: sortDirection
          description: For the `title`, `creator` and `releaseDate` sorts. Defaults to ascending, and descending (newest first) for `releaseDate`.
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [movie, tv, music, book, all]
            nullable: true
            default: all
        - in: query
          name: albumType
          description: With `mediaType` music, only albums of this Lidarr type. `other` is every type but album, EP and single.
          schema:
            type: string
            enum: [album, ep, single, other]
        - in: query
          name: format
          description: |
            With `mediaType` book, only books available in this format (`both` needs the ebook and the
            audiobook). Without it, `filter=allavailable` lists books available in either format.
          schema:
            type: string
            enum: [ebook, audiobook, both]
      responses:
        '200':
          description: Returned media
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaInfo'
  /media/{mediaId}:
    delete:
      summary: Delete media item
      description: Removes a media item. The `MANAGE_REQUESTS` permission is required to perform this action.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '204':
          description: Succesfully removed media item
  /media/{mediaId}/file:
    delete:
      summary: Delete media file
      description: Removes a media file from radarr/sonarr. The `ADMIN` permission is required to perform this action.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
        - in: query
          name: is4k
          description: Whether to remove from 4K service instance (true) or regular service instance (false)
          required: false
          example: false
          schema:
            type: boolean
      responses:
        '204':
          description: Successfully removed media item
  /media/{mediaId}/{status}:
    post:
      summary: Update media status
      description: Updates a media item's status and returns the media in JSON format
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
        - in: path
          name: status
          description: New status
          required: true
          example: available
          schema:
            type: string
            enum: [available, partial, processing, pending, unknown, deleted]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is4k:
                  type: boolean
                  example: false
                  description: |
                    When true, updates the 4K status field (status4k).
                    When false or not provided, updates the regular status field (status).
                    This applies to all status values (available, partial, processing, pending, unknown).
                isAudiobook:
                  type: boolean
                  example: false
                  description: Books only. When true, updates the audiobook status field (statusAudio) instead of the ebook status.
      responses:
        '200':
          description: Returned media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaInfo'
  /media/{mediaId}/files:
    get:
      summary: Get files for media
      description: |
        Returns the files on disk for a movie or series, as reported by Radarr or Sonarr, including size, quality and stream details.

        Full file paths are only included for users with the `MANAGE_REQUESTS` permission.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '200':
          description: Files for the media
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaFileInfo'
                  files4k:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaFileInfo'
  /media/{mediaId}/subtitles:
    get:
      summary: Get subtitles for media
      description: |
        Returns downloaded, wanted and missing subtitles for a movie, or for each episode of a series, as reported by Bazarr.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '200':
          description: Subtitle status for the media
          content:
            application/json:
              schema:
                type: object
                properties:
                  wanted:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubtitleLanguage'
                  available:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        name:
                          type: string
                  movie:
                    $ref: '#/components/schemas/SubtitleStatus'
                  episodes:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/SubtitleStatus'
                        - type: object
                          properties:
                            seasonNumber:
                              type: number
                            episodeNumber:
                              type: number
                            title:
                              type: string
    post:
      summary: Request subtitles for media
      description: |
        Asks Bazarr to search for and download one subtitle language. Series require a season and episode number.

        Requires the `REQUEST` permission.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - language
              properties:
                language:
                  type: string
                  example: pt
                forced:
                  type: boolean
                hi:
                  type: boolean
                seasonNumber:
                  type: number
                episodeNumber:
                  type: number
      responses:
        '204':
          description: Subtitle search started
  /media/{mediaId}/arr:
    get:
      summary: Get the media in its arr
      description: |
        Looks the media up in the arr that holds it (Radarr, Sonarr, Lidarr, Chaptarr or LazyLibrarian) and lists the actions an admin can take there: search again, search manually and replace the file. For series, the episodes Sonarr has are included.

        Requires the `MANAGE_REQUESTS` permission. Works with a personal key.
      tags:
        - media
        - nobookends
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
        - in: query
          name: is4k
          description: Use the 4K Radarr or Sonarr server
          required: false
          schema:
            type: boolean
        - in: query
          name: seasonNumber
          description: Series only, the season to act on
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: episodeNumber
          description: Series only, the episode of seasonNumber to act on
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: bookFormat
          description: Books only, the format to act on
          required: false
          schema:
            type: string
            enum: [ebook, audiobook]
      responses:
        '200':
          description: The media in its arr
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrItem'
        '400':
          description: The target is not valid for this media
  /media/{mediaId}/arr/search:
    post:
      summary: Search again in the arr
      description: |
        Has the arr run its automatic search for the movie, series, season, episode, album or book format (MoviesSearch, SeriesSearch, SeasonSearch, EpisodeSearch, AlbumSearch, BookSearch, or a LazyLibrarian book search).

        Requires the `MANAGE_REQUESTS` permission. Works with a personal key.
      tags:
        - media
        - nobookends
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is4k:
                  type: boolean
                  description: Use the 4K Radarr or Sonarr server
                seasonNumber:
                  type: integer
                  minimum: 0
                  description: Series only, the season to act on
                episodeNumber:
                  type: integer
                  minimum: 0
                  description: Series only, the episode of seasonNumber to act on
                bookFormat:
                  type: string
                  enum: [ebook, audiobook]
                  description: Books only, the format to act on
                issueId:
                  type: integer
                  description: The issue the action is taken from. A comment saying what was done is added to it.
                resolveIssue:
                  type: boolean
                  description: Resolve the issue as well, for users with the `MANAGE_ISSUES` permission
      responses:
        '200':
          description: The search was started
          content:
            application/json:
              schema:
                type: object
                properties:
                  issueResolved:
                    type: boolean
        '400':
          description: The target is not valid for this media, or the arr cannot do this
        '404':
          description: The media does not exist, or its arr does not have it
        '409':
          description: No arr is set up for this media
        '502':
          description: The arr returned an error
  /media/{mediaId}/arr/releases:
    get:
      summary: Search the arr for releases
      description: |
        Runs the arr's interactive search and lists the releases its indexers returned, approved ones first. Searching every indexer can take a minute or two. Series need a season or an episode. LazyLibrarian cannot list releases.

        Requires the `MANAGE_REQUESTS` permission. Works with a personal key.
      tags:
        - media
        - nobookends
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
        - in: query
          name: is4k
          description: Use the 4K Radarr or Sonarr server
          required: false
          schema:
            type: boolean
        - in: query
          name: seasonNumber
          description: Series only, the season to act on
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: episodeNumber
          description: Series only, the episode of seasonNumber to act on
          required: false
          schema:
            type: integer
            minimum: 0
        - in: query
          name: bookFormat
          description: Books only, the format to act on
          required: false
          schema:
            type: string
            enum: [ebook, audiobook]
      responses:
        '200':
          description: Releases found
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArrRelease'
        '400':
          description: The target is not valid for this media, or the arr cannot do this
        '404':
          description: The media does not exist, or its arr does not have it
        '409':
          description: No arr is set up for this media
        '502':
          description: The arr returned an error
  /media/{mediaId}/arr/grab:
    post:
      summary: Grab a release in the arr
      description: |
        Sends a release from the last release search to the arr's download client. The arr keeps search results for about 30 minutes.

        Requires the `MANAGE_REQUESTS` permission. Works with a personal key.
      tags:
        - media
        - nobookends
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - guid
                - indexerId
              properties:
                guid:
                  type: string
                indexerId:
                  type: integer
                title:
                  type: string
                  description: The release title, for the log and the issue comment
                replaced:
                  type: boolean
                  description: The file was replaced right before, for the issue comment
                is4k:
                  type: boolean
                  description: Use the 4K Radarr or Sonarr server
                seasonNumber:
                  type: integer
                  minimum: 0
                  description: Series only, the season to act on
                episodeNumber:
                  type: integer
                  minimum: 0
                  description: Series only, the episode of seasonNumber to act on
                bookFormat:
                  type: string
                  enum: [ebook, audiobook]
                  description: Books only, the format to act on
                issueId:
                  type: integer
                  description: The issue the action is taken from. A comment saying what was done is added to it.
                resolveIssue:
                  type: boolean
                  description: Resolve the issue as well, for users with the `MANAGE_ISSUES` permission
      responses:
        '200':
          description: The release was sent to the download client
          content:
            application/json:
              schema:
                type: object
                properties:
                  issueResolved:
                    type: boolean
        '400':
          description: The target is not valid for this media, or the arr cannot do this
        '404':
          description: The media does not exist, or its arr does not have it
        '409':
          description: No arr is set up for this media
        '502':
          description: The arr returned an error
  /media/{mediaId}/arr/replace:
    post:
      summary: Replace the file in the arr
      description: |
        Deletes the current file(s) of the movie, season, episode, album or book format in the arr, optionally marks the download they came from as failed so the arr blocklists that release, then has the arr search again unless the admin will pick a release. The media shows as processing until a scan finds the new file. Series need a season or an episode. LazyLibrarian cannot delete files.

        Requires the `MANAGE_REQUESTS` permission. Works with a personal key.
      tags:
        - media
        - nobookends
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blocklist:
                  type: boolean
                  default: true
                  description: Blocklist the release of the current file
                search:
                  type: string
                  enum: [automatic, interactive]
                  default: automatic
                  description: automatic has the arr search right away, interactive leaves picking a release to the admin
                is4k:
                  type: boolean
                  description: Use the 4K Radarr or Sonarr server
                seasonNumber:
                  type: integer
                  minimum: 0
                  description: Series only, the season to act on
                episodeNumber:
                  type: integer
                  minimum: 0
                  description: Series only, the episode of seasonNumber to act on
                bookFormat:
                  type: string
                  enum: [ebook, audiobook]
                  description: Books only, the format to act on
                issueId:
                  type: integer
                  description: The issue the action is taken from. A comment saying what was done is added to it.
                resolveIssue:
                  type: boolean
                  description: Resolve the issue as well, for users with the `MANAGE_ISSUES` permission
      responses:
        '200':
          description: The file was replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedFiles:
                    type: integer
                  blocklisted:
                    type: array
                    items:
                      type: string
                  searched:
                    type: boolean
                  issueResolved:
                    type: boolean
        '400':
          description: The target is not valid for this media, or the arr cannot do this
        '404':
          description: The media does not exist, or its arr does not have it
        '409':
          description: No arr is set up for this media
        '502':
          description: The arr returned an error
  /media/{mediaId}/watched:
    post:
      summary: Mark media watched or unwatched
      description: |
        Marks a movie or series watched or unwatched on the media server with the signed-in user's own account there, and returns what the server then reports.

        Only for users signed in with Plex, Jellyfin or Emby, and for titles the server has.
      tags:
