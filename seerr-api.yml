      description: Saves the NoBookEnds Sync settings. Fields left out keep their saved values. Enabling needs a URL.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoBookEndsSyncSettings'
      responses:
        '200':
          description: 'Values were successfully updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoBookEndsSyncSettings'
        '400':
          description: A URL is not an http or https address, or the integration was enabled without a URL
  /settings/nobookends-sync/test:
    post:
      summary: Test NoBookEnds Sync configuration
      description: Checks that the Sync server answers `GET /api/v1/health` at the internal URL, or the public one when there is no internal URL. With an admin token, also reads its status (`GET /api/v1/admin/status`) to check the token and report the background window, the queue and the running job. A Sync server without that endpoint (an older version) answers with its health and `statusUnavailable`. Without a token in the body, the saved token is used when the URL is the saved one.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  example: 'https://sync.example.com'
                internalUrl:
                  type: string
                  example: 'http://NoBookEnds-Sync:8000'
                adminToken:
                  type: string
      responses:
        '200':
          description: The Sync server answered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Whether the Sync server's worker is running
                  version:
                    type: string
                    example: '1.0.0'
                  gpu:
                    type: boolean
                    description: Whether it transcribes on a GPU, otherwise on the CPU
                  tokenValid:
                    type: boolean
                    description: Only set when an admin token was checked
                  statusUnavailable:
                    type: boolean
                    description: Set when the Sync server has no status endpoint (an older version, or no ADMIN_TOKEN), so only its health is known
                  status:
                    type: object
                    description: Only set when the admin token works
                    properties:
                      version:
                        type: string
                      gpu:
                        type: boolean
                      window:
                        type: object
                        description: Background alignments only run inside this window. Start and end are null and active is true when there is none.
                        properties:
                          start:
                            type: string
                            nullable: true
                            example: '01:00'
                          end:
                            type: string
                            nullable: true
                            example: '06:00'
                          active:
                            type: boolean
                      queue:
                        type: object
                        properties:
                          user:
                            type: number
                            description: Queued at user or admin priority
                            example: 0
                          auto:
                            type: number
                            description: Queued background work
                            example: 12
                          total:
                            type: number
                            example: 12
                      current:
                        type: object
                        nullable: true
                        properties:
                          audioItemId:
                            type: string
                          ebookItemId:
                            type: string
                          title:
                            type: string
                            nullable: true
                          progress:
                            type: number
                            nullable: true
                            example: 0.42
        '400':
          description: The URL is not an http or https address
        '500':
          description: The Sync server did not answer
  /settings/nobookends-sync/backfill:
    post:
      summary: Queue every book on NoBookEnds Sync
      description: Queues every book that has both an audiobook and an ebook item in Audiobookshelf on the Sync server as background work, in bulk calls of at most 500 pairs (`POST /api/v1/admin/alignments` with `pairs`, priority `auto`, source `allseerr-backfill`). The Sync server runs background work in its overnight window and leaves pairs it already has alone. Pairs it refuses for good (an item missing, or without audio or an EPUB) are counted as rejected, pairs it could not check are tried again later.
      tags:
        - settings
      responses:
        '200':
          description: Books queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    description: Books with both formats
                    example: 40
                  accepted:
                    type: number
                    description: Pairs the Sync server took
                    example: 38
                  rejected:
                    type: number
                    description: Pairs refused for good (not_found, no_audio or no_epub)
                    example: 2
                  failed:
                    type: number
                    description: Pairs not taken this time, tried again later
                    example: 0
                  window:
                    type: object
                    description: When background alignments run, when the Sync server reports it
                    properties:
                      start:
                        type: string
                        nullable: true
                        example: '01:00'
                      end:
                        type: string
                        nullable: true
                        example: '06:00'
                      active:
                        type: boolean
        '400':
          description: NoBookEnds Sync is not enabled or has no admin token
        '502':
          description: The Sync server did not answer
