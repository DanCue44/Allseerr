  /calendar:
    get:
      summary: Get upcoming releases
      description: |
        Returns movie releases, episode air dates and album releases between the start and end dates (YYYY-MM-DD), pulled from the configured Radarr, Sonarr and Lidarr servers. The range cannot be longer than 62 days. Requesters are only included for users who can view all requests.
      tags:
        - calendar
      parameters:
        - in: query
          name: start
          required: true
          schema:
            type: string
            example: '2026-10-01'
        - in: query
          name: end
          required: true
          schema:
            type: string
            example: '2026-10-31'
      responses:
        '200':
          description: Calendar items returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  start:
                    type: string
                    example: '2026-10-01'
                  end:
                    type: string
                    example: '2026-10-31'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalendarItem'
        '400':
          description: Invalid date range
