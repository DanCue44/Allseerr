  /settings/user-access/nobookends-directory:
    get:
      summary: Get the NoBookEnds directory listing
      description: Whether this server is listed in the NoBookEnds directory (`nobookendsDirectory` in the user access settings, off by default), what it still needs, and how the last registration went. The directory keeps the Application URL, the application title and a one-way code (SHA-256) of each Plex server the admin owns.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoBookEndsDirectoryStatus'
    post:
      summary: List this server in the NoBookEnds directory, or take it out
      description: Turning it on registers right away with the Plex admin's token, the Application URL and a new code the directory checks at `GET /nobookends/directory`, and again every day while it is on (the NoBookEnds Directory job). Turning it off asks the directory to remove the listing. The registration result is in `lastResult`.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoBookEndsDirectoryStatus'
        '400':
          description: The Application URL or Plex is not set up
