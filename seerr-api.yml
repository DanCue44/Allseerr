        publicUrl:
          type: string
          example: https://kavita.example.com
        message:
          type: string
          description: The state in plain words
        signInWithAllseerr:
          type: boolean
          description: Whether the app offers "Sign in with Allseerr"
        ownAccount:
          type: boolean
          description: A ready account the person had before Allseerr linked it. It keeps the password they chose.
        canResetPassword:
          type: boolean
          description: Whether the person can get a new password here, only for accounts Allseerr made
