  securitySchemes:
    cookieAuth:
      type: apiKey
      name: connect.sid
      in: cookie
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key

paths:
  /status:
    get:
      summary: Get Allseerr status
      description: Returns the current Allseerr status in a JSON object. updateAvailable and commitsBehind are omitted when checkUpdateAvailable is false.
      security: []
      tags:
        - public
      parameters:
        - in: query
          name: checkUpdateAvailable
          description: If false, updateAvailable and commitsBehind will be omitted from the response. Defaults to the versionCheck setting.
          required: false
          example: false
          schema:
            type: boolean
      responses:
        '200':
          description: Returned status
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 3.5.0.1
                  commitTag:
                    type: string
                  releaseBuild:
                    type: boolean
                    description: True for release images, which are tagged with their version instead of a commit
                  updateAvailable:
                    type: boolean
                  commitsBehind:
                    type: number
                    description: Commits the build is behind its branch, -1 when unknown. Always 0 for release builds.
                  restartRequired:
                    type: boolean
  /status/appdata:
    get:
      summary: Get application data volume status
      description: For Docker installs, returns whether or not the volume mount was configured properly. Always returns true for non-Docker installs.
      security: []
      tags:
        - public
      responses:
        '200':
          description: Application data volume status and path
          content:
            application/json:
              schema:
                type: object
                properties:
                  appData:
                    type: boolean
                    example: true
                  appDataPath:
                    type: string
                    example: /app/config
                  appDataPermissions:
                    type: boolean
                    example: true
  /settings/main:
    get:
      summary: Get main settings
      description: Retrieves all main settings in a JSON object.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainSettings'
    post:
      summary: Update main settings
      description: Updates main settings with the provided values.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MainSettings'
      responses:
        '200':
          description: 'Values were sucessfully updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainSettings'
  /settings/network:
    get:
      summary: Get network settings
      description: Retrieves all network settings in a JSON object.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainSettings'
    post:
      summary: Update network settings
      description: Updates network settings with the provided values.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkSettings'
      responses:
        '200':
          description: 'Values were sucessfully updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkSettings'
  /settings/main/regenerate:
    post:
      summary: Get main settings with newly-generated API key
      description: Returns main settings in a JSON object, using the new API key.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainSettings'
  /settings/googlebooks/test:
    post:
      summary: Test a Google Books API key
      description: Makes one Google Books API request with the given key, or with the saved key when none is given.
      tags:
        - settings
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey:
                  type: string
                  example: yourapikey
      responses:
        '200':
          description: Google Books accepted the key
          content:
            application/json:
              schema:
                type: object
        '400':
          description: No key was given and none is saved
        '500':
          description: Google Books rejected the request
  /settings/main/logo:
    post:
      summary: Upload an application logo
      description: |
        Replaces the application logo shown in the interface, favicons, web app manifest, emails and web push notifications. The image must be a square PNG, SVG or WebP file of at most 2 MB, sent base64 encoded (a data URL is accepted). Icons in every size are generated from it and stored in the config directory.

        Requires the `ADMIN` permission.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  description: The image as a base64 data URL or bare base64
                  example: 'data:image/png;base64,iVBORw0KGgo...'
      responses:
        '200':
          description: Logo saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationLogoVersion:
                    type: string
                    example: 3f2a9c81d4e7
        '400':
          description: The image is missing, too large, not square or not a PNG, SVG or WebP file
    delete:
      summary: Reset the application logo
      description: Removes the uploaded logo so the bundled logo is used again. Requires the `ADMIN` permission.
      tags:
        - settings
      responses:
        '200':
          description: Logo removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationLogoVersion:
                    type: string
                    example: ''
  /settings/jellyfin:
    get:
      summary: Get Jellyfin settings
      description: Retrieves current Jellyfin settings.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JellyfinSettings'
    post:
      summary: Update Jellyfin settings
      description: Updates Jellyfin settings with the provided values.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JellyfinSettings'
      responses:
        '200':
          description: 'Values were successfully updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JellyfinSettings'
  /settings/jellyfin/library:
    get:
      summary: Get Jellyfin libraries
      description: Returns a list of Jellyfin libraries in a JSON array.
      tags:
        - settings
