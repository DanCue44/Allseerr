  /settings/audiobookshelf/match-authors:
    post:
      summary: Match Audiobookshelf authors
      description: Lists the authors of the audiobook and ebook libraries (`GET /api/libraries/{id}/authors`) with the saved admin API key and matches each one without a photo (`POST /api/authors/{id}/match`), one at a time, so Audiobookshelf fetches its photo and bio from Audnexus. Answers once done, or after about 45 seconds with the counts so far and `done` false while the rest is matched in the background. Asking again while a run is under way answers with its progress.
      tags:
        - settings
      responses:
        '200':
          description: Authors matched, or still being matched
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    description: Authors in the libraries
                    example: 120
                  matched:
                    type: number
                    description: Authors without a photo that got one
                    example: 30
                  noPhoto:
                    type: number
                    description: Authors without a photo that Audnexus has none for
                    example: 4
                  failed:
                    type: number
                    description: Authors that could not be matched this time
                    example: 0
                  done:
                    type: boolean
                    description: False while the rest is still matched in the background
                    example: true
        '400':
          description: Audiobookshelf has no URL, no admin API key or no library
  /settings/nobookends-sync:
    get:
      summary: Get NoBookEnds Sync settings
      description: Retrieves the NoBookEnds Sync settings. The admin token is never returned, only whether one is saved.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoBookEndsSyncSettings'
