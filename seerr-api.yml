openapi: '3.0.2'
info:
  title: 'Seerr API'
  version: '1.0.0'
  description: |
    This is the documentation for the Seerr API backend.

    Two primary authentication methods are supported:

    - **Cookie Authentication**: A valid sign-in to the `/auth/plex` or `/auth/local` will generate a valid authentication cookie.
    - **API Key Authentication**: Sign-in is also possible by passing an `X-Api-Key` header along with a valid API Key generated by Seerr.
    - **Personal API Keys**: Keys starting with `asu_`, made by a user under their profile settings (API Key, or the NoBookEnds connect link), act as that user in the `X-Api-Key` header with their permissions. `X-Api-User` is ignored for them.
tags:
  - name: public
    description: Public API endpoints requiring no authentication.
  - name: settings
    description: Endpoints related to Seerr's settings and configuration.
  - name: auth
    description: Endpoints related to logging in or out, and the currently authenticated user.
  - name: users
    description: Endpoints related to user management.
  - name: user-access
    description: |
      Accounts Allseerr manages for the people it knows in Audiobookshelf, Kavita and Komga: who may use which app and libraries, an age limit per person passed on to every app, and invite links. Needs the Manage Users permission; the app connections are settings and need an admin.
  - name: search
    description: Endpoints related to search and discovery.
  - name: request
    description: Endpoints related to request management.
  - name: movies
    description: Endpoints related to retrieving movies and their details.
  - name: tv
    description: Endpoints related to retrieving TV series and their details.
  - name: music
    description: Endpoints related to retrieving albums, artists and their artwork.
  - name: books
    description: Endpoints related to retrieving books and authors from OpenLibrary.
  - name: comics
    description: Comic and manga series from Talearr's comics library.
  - name: downloads
    description: The queues of every arr in one list, for admins.
  - name: nobookends
    description: |
      The NoBookEnds companion app reads and listens to books through Audiobookshelf, and can request and report books here with the personal key from its connect link (`X-Api-Key: asu_...`). Besides `/nobookends/status`, it uses these endpoints, which all accept personal keys:

      - `GET /search?type=book` to search books
      - `GET /nobookends/item/{absItemId}` for the book of an Audiobookshelf library item
      - `GET /book/{bookId}` for a book, its status per format (`mediaInfo.status` for the ebook, `mediaInfo.statusAudio` for the audiobook) and its Audiobookshelf item per format
      - `POST /request` with `mediaType: book` and `isAudiobook` to request a format
      - With Talearr (`books.recordings` in the status), `recordings`, `canRequestUnabridged`, `canRequestAbridged` and `recordingRequests` on the item, and `POST /request` with `recording: unabridged` or `recording: abridged` to ask for the unabridged recording of an abridged audiobook or the abridged recording of an unabridged one
      - With Talearr, `books.audiobookVersions` in the status: at `requester`, `audiobookVersion` on `POST /request` picks the unabridged reading, the abridged one or both
      - `GET /request?mediaType=book&requestedBy={userId}` for the user's requests, with download progress in `media.downloadStatus` (ebook) and `media.downloadStatusAudio` (audiobook)
      - `POST /issue` with `bookFormat` to report a problem with a format
      - `GET /discover/books` and `GET /discover/books/upcoming` for discovery

      For reading apps, any user (also one who cannot request) can use `GET /nobookends/reading-apps`, `POST /nobookends/reading-apps/{app}/connect` and `POST /nobookends/reading-apps/{app}/request-access`.

      For users who may manage requests (`downloads.canManage` in the status), it also uses:

      - `GET /nobookends/attention` for book downloads Chaptarr is stuck on, and `POST /nobookends/attention/{key}/dismiss` to remove one and search again
      - `GET /media/{mediaId}/arr?bookFormat=` for what can be done to a format in its arr
      - `POST /media/{mediaId}/arr/search` to search again, `GET /media/{mediaId}/arr/releases` to list releases, `POST /media/{mediaId}/arr/grab` to grab one and `POST /media/{mediaId}/arr/replace` to replace the file

      To connect, the app opens the Allseerr page `/nobookends/connect?device={name}` in a sign in window. It asks the user to sign in when needed, then to confirm, and sends the app to `nobookends://connect#abs=...&allseerr=...&key=asu_...` with the same values as a connect link, or to `nobookends://connect#error=cancelled`, `#error=unavailable` (books or Audiobookshelf are not set up) or `#error=no_app_url` (no address that works away from home). Each device gets its own key. Without a key `GET /nobookends/status` answers 403, which tells the app the address is an Allseerr that supports NoBookEnds.

      On a Plex server the app can also connect with a Plex token it got itself: `POST /auth/nobookends/plex` answers the same `nobookends://connect#...` app URL. When an admin lists the server in the NoBookEnds directory, people who sign in to NoBookEnds with Plex find this Allseerr without typing its address. The directory checks the address with `GET /nobookends/directory`.

      When an admin set up NoBookEnds Sync, the status carries its public address in `nobookendsSync.url`. The app fetches Listen and Read alignments from there with the user's Audiobookshelf token. Allseerr queues each book on the Sync server, at user priority, once it has both an audiobook and an ebook in Audiobookshelf.
  - name: other
    description: Endpoints related to other TMDB data
  - name: person
    description: Endpoints related to retrieving person details.
  - name: media
    description: Endpoints related to media management.
  - name: collection
    description: Endpoints related to retrieving collection details.
  - name: service
    description: Endpoints related to getting service (Radarr/Sonarr/Lidarr) details.
  - name: watchlist
    description: Collection of media to watch later
  - name: favorite
    description: Movies, series, albums and books a user has marked as favorites.
  - name: library
    description: Browse the movies, series and collections already on the server.
  - name: blocklist
    description: Blocklisted media from discovery page.
  - name: calendar
    description: Upcoming releases from the configured Radarr, Sonarr and Lidarr servers.
servers:
  - url: '{server}/api/v1'
    variables:
      server:
        default: http://localhost:5055

components:
  schemas:
    Blocklist:
      type: object
      properties:
        tmdbId:
          type: number
          example: 1
        mbId:
          type: string
          description: MusicBrainz release group id, for albums in place of tmdbId
          example: 1dc4c347-a1db-32aa-b14f-bc9cc507b843
        olId:
          type: string
          description: OpenLibrary work id, for books in place of tmdbId
          example: OL45804W
        mediaType:
          type: string
          enum: [movie, tv, music, book]
        title:
          type: string
        media:
          $ref: '#/components/schemas/MediaInfo'
        userId:
          type: number
          example: 1
    CalendarItem:
      type: object
      properties:
        id:
          type: string
          example: episode-393189-2-5
        type:
          type: string
          enum: [movie, episode, album]
        date:
          type: string
          example: '2026-10-09'
        airDateUtc:
          type: string
          example: '2026-10-10T01:00:00Z'
        releaseType:
          type: string
          enum: [cinema, digital, physical, airing, release]
        title:
          type: string
          example: Andor
        subtitle:
          type: string
          example: S02E05 - The Long Night
        tmdbId:
          type: number
          example: 83867
        tvdbId:
          type: number
          example: 393189
        posterUrl:
          type: string
          example: https://artworks.thetvdb.com/banners/andor.jpg
        hasFile:
          type: boolean
          example: false
        mediaId:
          type: number
          example: 11
        requestedBy:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
                example: 1
              displayName:
                type: string
                example: Alex
              avatar:
                type: string
        requestedByMe:
          type: boolean
          example: true
    Favorite:
      type: object
      properties:
        id:
          type: integer
          example: 1
          readOnly: true
        tmdbId:
          type: number
          example: 550
        mbId:
          type: string
          description: MusicBrainz release group id, for albums in place of tmdbId
          example: 1dc4c347-a1db-32aa-b14f-bc9cc507b843
        olId:
          type: string
          description: OpenLibrary work id, for books in place of tmdbId
          example: OL45804W
        mediaType:
          type: string
          enum: [movie, tv, music, book]
        createdAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
    WatchlistRequest:
      type: object
      required:
        - mediaType
      properties:
        tmdbId:
          type: number
          example: 1
        mbId:
          type: string
          description: MusicBrainz release group or artist id, in place of tmdbId
        olId:
          type: string
          description: OpenLibrary work or author id, in place of tmdbId
        mediaType:
          type: string
          enum: [movie, tv, music, book, artist, author]
        ratingKey:
          type: string
        title:
          type: string
    Watchlist:
      type: object
      properties:
        id:
          type: integer
          example: 1
          readOnly: true
        tmdbId:
          type: number
          example: 1
        mbId:
          type: string
          description: MusicBrainz release group id, for albums in place of tmdbId, or MusicBrainz artist id, for followed artists
          example: 1dc4c347-a1db-32aa-b14f-bc9cc507b843
        olId:
          type: string
          description: OpenLibrary work id, for books in place of tmdbId, or OpenLibrary author id, for followed authors
          example: OL45804W
        mediaType:
          type: string
          description: Artists and authors are followed by adding them with the artist or author media type
          enum: [movie, tv, music, book, artist, author]
        ratingKey:
          type: string
        type:
          type: string
        title:
          type: string
        media:
          $ref: '#/components/schemas/MediaInfo'
        createdAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        updatedAt:
          type: string
          example: '2020-09-12T10:00:27.000Z'
          readOnly: true
        requestedBy:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
          readOnly: true
        email:
          type: string
          example: 'hey@itsme.com'
          readOnly: true
        username:
          type: string
        plexUsername:
          type: string
          readOnly: true
        plexToken:
          type: string
          readOnly: true
        jellyfinAuthToken:
          type: string
          readOnly: true
        userType:
          type: integer
          example: 1
          readOnly: true
        permissions:
          type: number
          example: 0
        avatar:
          type: string
          readOnly: true
        createdAt:
          type: string
          example: '2020-09-02T05:02:23.000Z'
          readOnly: true
        updatedAt:
          type: string
          example: '2020-09-02T05:02:23.000Z'
          readOnly: true
        requestCount:
          type: number
          example: 5
          readOnly: true
        movieRatingLimit:
          type: string
          nullable: true
          example: 'PG-13'
          readOnly: true
        tvRatingLimit:
          type: string
          nullable: true
          example: 'TV-PG'
          readOnly: true
      required:
        - id
        - email
        - createdAt
        - updatedAt
    UserSettings:
      type: object
      properties:
        username:
          type: string
          nullable: true
          example: 'Mr User'
        email:
          type: string
          example: 'user@example.com'
        locale:
          type: string
          nullable: true
          example: 'en'
        discoverRegion:
          type: string
          nullable: true
          example: 'US'
        streamingRegion:
          type: string
          nullable: true
          example: 'US'
        blockedWatchProviders:
          type: string
          nullable: true
          example: '8|1796'
          description: TMDB watch provider IDs, separated by a pipe. Titles streaming on these subscription providers in the streaming region cannot be requested.
        originalLanguage:
          type: string
          nullable: true
          example: 'en'
        accentColor:
          type: string
          nullable: true
          example: '#4F8EF7'
          description: Accent color of the Ambient interface for this user. Empty or null uses the server accent color.
        bookLanguage:
          type: string
          nullable: true
          enum:
            [
              en,
              es,
              fr,
              de,
              it,
              pt,
              nl,
              sv,
              da,
              'no',
              fi,
              pl,
              ru,
              ja,
              zh,
              ko,
              any,
              null,
            ]
          example: en
          description: ISO 639-1 code of the language this user requests books in. Null uses the server default.
        movieQuotaLimit:
          type: number
          nullable: true
          description: 'Maximum number of movie requests allowed'
          example: 10
        movieQuotaDays:
          type: number
          nullable: true
          description: 'Time period in days for movie quota'
          example: 30
        tvQuotaLimit:
          type: number
          nullable: true
          description: 'Maximum number of TV requests allowed'
          example: 5
        tvQuotaDays:
          type: number
          nullable: true
          description: 'Time period in days for TV quota'
          example: 14
        musicQuotaLimit:
          type: number
          nullable: true
          description: 'Maximum number of music requests allowed'
          example: 10
        musicQuotaDays:
          type: number
          nullable: true
          description: 'Time period in days for music quota'
          example: 30
        bookQuotaLimit:
          type: number
          nullable: true
          description: 'Maximum number of book requests allowed. Each format of a book counts as one request.'
          example: 10
        bookQuotaDays:
          type: number
          nullable: true
          description: 'Time period in days for book quota'
          example: 30
        movieRatingLimit:
          type: string
          nullable: true
          description: 'Highest US movie certification the user may request (G, PG, PG-13, R or NC-17). Null means no limit. Only users with the `MANAGE_USERS` permission can change it.'
          example: 'PG-13'
        tvRatingLimit:
          type: string
          nullable: true
          description: 'Highest US TV rating the user may request (TV-Y, TV-Y7, TV-G, TV-PG, TV-14 or TV-MA). Null means no limit. Only users with the `MANAGE_USERS` permission can change it.'
          example: 'TV-PG'
        globalMovieQuotaDays:
          type: number
          nullable: true
          description: 'Global movie quota days setting'
          example: 30
        globalMovieQuotaLimit:
          type: number
          nullable: true
          description: 'Global movie quota limit setting'
          example: 10
        globalTvQuotaLimit:
          type: number
          nullable: true
          description: 'Global TV quota limit setting'
          example: 5
        globalTvQuotaDays:
          type: number
          nullable: true
          description: 'Global TV quota days setting'
          example: 14
        globalMusicQuotaLimit:
          type: number
          nullable: true
          description: 'Global music quota limit setting'
          example: 10
        globalMusicQuotaDays:
          type: number
          nullable: true
          description: 'Global music quota days setting'
          example: 30
        globalBookQuotaLimit:
          type: number
          nullable: true
          description: 'Global book quota limit setting'
          example: 10
        globalBookQuotaDays:
          type: number
          nullable: true
          description: 'Global book quota days setting'
          example: 30
        watchlistSyncMovies:
          type: boolean
          nullable: true
          description: 'Enable watchlist sync for movies'
          example: true
        watchlistSyncTv:
          type: boolean
          nullable: true
          description: 'Enable watchlist sync for TV'
          example: false
        hideWatched:
          type: boolean
          nullable: true
          description: 'Leave out titles the user has watched on the media server from Discover and search'
          example: false
    MainSettings:
      type: object
      properties:
        apiKey:
          type: string
          readOnly: true
        appLanguage:
          type: string
          example: en
        applicationTitle:
          type: string
          example: Seerr
        applicationUrl:
          type: string
          example: https://os.example.com
        applicationLogoVersion:
          type: string
          readOnly: true
          example: 3f2a9c81d4e7
          description: Version of the uploaded application logo, empty when the bundled logo is used. Changes only through the logo upload and reset endpoints.
        accentColor:
          type: string
          pattern: '^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$'
          example: '#EC703E'
          description: Accent color of the Ambient interface.
        hideAvailable:
          type: boolean
          example: false
        hideRequested:
          type: boolean
          example: false
        partialRequestsEnabled:
          type: boolean
          example: false
        allowCurrentSeasonRequests:
          type: boolean
          example: false
          description: Allows users without the Manage Requests permission to request only the current season of a series. Managers can always make these requests. When a new season starts, the older seasons those requests brought in are deleted from disk after the notice period, and seasons that were already available are kept unless an admin approves deleting them.
        defaultBookFormat:
          type: string
          enum: [ebook, audiobook, both]
          example: both
          description: Format preselected when requesting a book.
        bookLanguage:
          type: string
          enum:
            [
              en,
              es,
              fr,
              de,
              it,
              pt,
              nl,
              sv,
              da,
              'no',
              fi,
              pl,
              ru,
              ja,
              zh,
              ko,
              any,
            ]
          example: en
          description: ISO 639-1 code of the language books are requested in, unless a user sets their own. `any` takes whichever language is found. With Chaptarr, Allseerr keeps a tag and a release profile for each requested language.
        bookService:
          type: string
          enum: [chaptarr, talearr, lazylibrarian]
          example: chaptarr
          description: Service book requests are sent to. Talearr, a Chaptarr fork, uses the Chaptarr servers. When it is not set or not configured, Chaptarr is used when configured, otherwise LazyLibrarian.
        audiobookVersions:
          type: string
          enum: [both, unabridged, abridged, requester]
          example: both
          description: Talearr only. Which readings of an audiobook an approved request asks Talearr for. `both` (the default, also when not set) adds the audiobook as usual, so Talearr searches for the unabridged reading, then asks for the abridged reading as a recording request of its own when Talearr knows an abridged edition. `unabridged` follows Talearr's global grab policy. `abridged` sets the book's grab policy in Talearr to abridged only before the search, or asks for the abridged recording when Talearr has no per book grab policy. `requester` lets the requester pick one of the three with `audiobookVersion` on `POST /request`.
        googleBooksApiKey:
          type: string
          example: yourapikey
          description: Google Books API key used to check whether books have ebook editions. Left empty, ebook editions are not checked. Only returned to admins.
        currentSeasonRolloverDelayDays:
          type: integer
          minimum: 0
          example: 3
          description: Days admins are notified before older seasons of a current season request are deleted.
        localLogin:
          type: boolean
          example: true
        mediaServerType:
          type: number
          example: 1
        newPlexLogin:
          type: boolean
          example: true
        defaultPermissions:
          type: number
          example: 32
        enableSpecialEpisodes:
          type: boolean
          example: false
        versionCheck:
          type: boolean
          example: false
    NetworkSettings:
      type: object
      properties:
        csrfProtection:
          type: boolean
          example: false
        forceIpv4First:
          type: boolean
          example: false
        trustProxy:
          type: boolean
          example: false
        proxy:
          type: object
          properties:
            enabled:
              type: boolean
              example: false
            hostname:
              type: string
              example: ''
            port:
              type: number
              example: 8080
            useSsl:
              type: boolean
              example: false
            user:
              type: string
              example: ''
            password:
              type: string
              example: ''
            bypassFilter:
              type: string
              example: ''
            bypassLocalAddresses:
              type: boolean
              example: true
        dnsCache:
          type: object
          properties:
            enabled:
              type: boolean
              example: false
            forceMinTtl:
              type: number
              example: 0
            forceMaxTtl:
              type: number
              example: -1
    PlexLibrary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Movies
        enabled:
          type: boolean
          example: false
      required:
        - id
        - name
        - enabled
    PlexSettings:
      type: object
      properties:
        name:
          type: string
          example: 'Main Server'
          readOnly: true
        machineId:
          type: string
          example: '1234123412341234'
          readOnly: true
        ip:
          type: string
          example: '127.0.0.1'
        port:
          type: number
          example: 32400
        useSsl:
          type: boolean
          nullable: true
        libraries:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/PlexLibrary'
        webAppUrl:
          type: string
          nullable: true
          example: 'https://app.plex.tv/desktop'
      required:
        - name
        - machineId
        - ip
        - port
    PlexConnection:
      type: object
      properties:
        protocol:
          type: string
          example: 'https'
        address:
          type: string
          example: '127.0.0.1'
        port:
          type: number
          example: 32400
        uri:
          type: string
          example: 'https://127-0-0-1.2ab6ce1a093d465e910def96cf4e4799.plex.direct:32400'
        local:
          type: boolean
          example: true
        status:
          type: number
          example: 200
        message:
          type: string
          example: 'OK'
      required:
        - protocol
        - address
        - port
        - uri
        - local
    PlexDevice:
      type: object
      properties:
        name:
          type: string
          example: 'My Plex Server'
        product:
          type: string
          example: 'Plex Media Server'
        productVersion:
          type: string
          example: '1.21'
        platform:
          type: string
          example: 'Linux'
        platformVersion:
          type: string
          example: 'default/linux/amd64/17.1/systemd'
        device:
          type: string
          example: 'PC'
        clientIdentifier:
          type: string
          example: '85a943ce-a0cc-4d2a-a4ec-f74f06e40feb'
        createdAt:
          type: string
          example: '2021-01-01T00:00:00.000Z'
        lastSeenAt:
          type: string
          example: '2021-01-01T00:00:00.000Z'
        provides:
          type: array
          items:
            type: string
            example: 'server'
        owned:
          type: boolean
          example: true
        ownerID:
          type: string
          example: '12345'
        home:
          type: boolean
          example: true
        sourceTitle:
          type: string
          example: 'xyzabc'
        accessToken:
          type: string
          example: 'supersecretaccesstoken'
        publicAddress:
          type: string
          example: '127.0.0.1'
        httpsRequired:
          type: boolean
          example: true
        synced:
          type: boolean
          example: true
        relay:
          type: boolean
          example: true
        dnsRebindingProtection:
          type: boolean
          example: false
        natLoopbackSupported:
          type: boolean
          example: false
        publicAddressMatches:
          type: boolean
          example: false
        presence:
          type: boolean
          example: true
        connection:
          type: array
          items:
            $ref: '#/components/schemas/PlexConnection'
      required:
        - name
        - product
        - productVersion
        - platform
        - device
        - clientIdentifier
        - createdAt
        - lastSeenAt
        - provides
        - owned
        - connection
    JellyfinLibrary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Movies
        enabled:
          type: boolean
          example: false
      required:
        - id
        - name
        - enabled
    JellyfinSettings:
      type: object
      properties:
        name:
          type: string
          example: 'Main Server'
          readOnly: true
        hostname:
          type: string
          example: 'http://my.jellyfin.host'
        externalHostname:
          type: string
          example: 'http://my.jellyfin.host'
        jellyfinForgotPasswordUrl:
          type: string
          example: 'http://my.jellyfin.host/web/index.html#!/forgotpassword.html'
        adminUser:
          type: string
          example: 'admin'
        adminPass:
          type: string
          example: 'mypassword'
        libraries:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/JellyfinLibrary'
        serverID:
          type: string
          readOnly: true
    MetadataSettings:
      type: object
      properties:
        settings:
          type: object
          properties:
            tv:
              type: string
              enum: [tvdb, tmdb]
              example: 'tvdb'
            anime:
