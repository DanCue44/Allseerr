  /request:
    get:
      summary: Get all requests
      description: |
        Returns all requests if the user has the `ADMIN` or `MANAGE_REQUESTS` permissions. Otherwise, only the logged-in user's requests are returned.

        If the `requestedBy` parameter is specified, only requests from that particular user ID will be returned.
      tags:
        - request
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 20
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: filter
          schema:
            type: string
            nullable: true
            enum:
              [
                all,
                approved,
                available,
                pending,
                processing,
                unavailable,
                failed,
                deleted,
                completed,
              ]
        - in: query
          name: sort
          schema:
            type: string
            enum: [added, modified]
            default: added
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [asc, desc]
            nullable: true
            default: desc
        - in: query
          name: requestedBy
          schema:
            type: number
            nullable: true
            example: 1
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [movie, tv, music, book, comic, all]
            nullable: true
            default: all
      responses:
        '200':
          description: Requests returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaRequest'
    post:
      summary: Create new request
      description: |
        Creates a new request with the provided media ID and type. The `REQUEST` permission is required.

        If the user has the `ADMIN` or `AUTO_APPROVE` permissions, their request will be auomatically approved.
      tags:
        - request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaType:
                  type: string
                  enum: [movie, tv, music, book, comic]
                  example: movie
                mediaId:
                  oneOf:
                    - type: number
                    - type: string
                  description: TMDB ID for movies and series, MusicBrainz release group ID for music, OpenLibrary work ID for books, comic ID (such as `al-30013`) for comic and manga series
                  example: 123
                tvdbId:
                  type: number
                  example: 123
                seasons:
                  oneOf:
                    - type: array
                      items:
                        type: number
                        minimum: 0
                    - type: string
                      enum: [all]
                episodes:
                  type: array
                  description: Series only. Requests only these episodes of each listed season, which counts as one season against quotas and auto-approve rules. A season listed here does not need to be in `seasons`. Requires partial series requests to be enabled.
                  items:
                    $ref: '#/components/schemas/RequestedEpisodes'
                monitorMode:
                  type: string
                  enum: [seasons, future, current]
                  description: Series only. `future` ignores `seasons` and `episodes`, requests the seasons that are airing or announced, and has Sonarr monitor only episodes that have not aired yet, without a search. Requires partial series requests to be enabled. `current` ignores `seasons` and `episodes`, requests the season with the latest aired episode, and has Sonarr search it and monitor new seasons. When a new season starts, older seasons the request brought in are deleted after a notice period, while seasons that were already available are kept unless an admin approves deleting them. Users without the `MANAGE_REQUESTS` permission need current season requests to be allowed, otherwise the request is refused with 403.
                is4k:
                  type: boolean
                  example: false
                isAudiobook:
                  type: boolean
                  example: false
                  description: Books only. Requests the audiobook instead of the ebook. Each format is its own request.
                language:
                  type: string
                  enum:
                    [
                      en,
                      es,
                      fr,
                      de,
                      it,
                      pt,
                      nl,
                      sv,
                      da,
                      'no',
                      fi,
                      pl,
                      ru,
                      ja,
                      zh,
                      ko,
                      any,
                    ]
                  example: en
                  description: Books only. ISO 639-1 code of the language to request the book in, or `any`. Only honored for users with the `MANAGE_REQUESTS` permission. Everyone else requests in their own language and a different value is ignored.
                recording:
                  type: string
                  enum: [unabridged, abridged, narrator, edition]
                  description: Audiobooks on Talearr only. Requests another recording of an audiobook that is already available in Talearr instead of the audiobook itself, such as the unabridged reading of a book the library has abridged, or the abridged reading of one it has unabridged. `GET /book/{bookId}/recordings` lists what can be asked for. The request needs approval like a book request unless the user may auto-approve, counts against the book quota, and is refused with 400 when Talearr is not the book service or the audiobook is not available there, and with 409 when the same recording was requested already.
                recordingNarrator:
                  type: string
                  maxLength: 200
                  description: Required for `recording` `narrator`. The narrator to ask Talearr for.
                  example: Scott Brick
                recordingEditionId:
                  type: number
                  minimum: 1
                  description: Required for `recording` `edition`. Talearr's id of the edition, from the candidates of `GET /book/{bookId}/recordings`.
                audiobookVersion:
                  type: string
                  nullable: true
                  enum: [unabridged, abridged, both, null]
                  description: Audiobooks on Talearr only. The readings to ask for, honored when Audiobook Versions is set to `requester` (see `audiobookVersions` in the public settings and `books.audiobookVersions` in `GET /nobookends/status`) and ignored otherwise. Without one, such a request asks for both. Refused with 400 when unknown.
                comicKind:
                  type: string
                  enum: [manga, comic]
                  description: Comics only. Files a series only Hardcover knows as manga or as a comic (see `kindKnown` in `GET /comic/{comicId}`). Ignored for a series AniList knows, which is manga, and once a series has been requested.
                volumes:
                  type: array
                  nullable: true
                  maxItems: 1000
                  items:
                    type: number
                    minimum: 0
                  example: [1, 2, 3, 7]
                  description: Comics only. Requests only these volume numbers of the series (see `volumeList` in `GET /comic/{comicId}`) instead of the whole series. They are deduplicated and sorted. Without them, or with an empty list, the whole series is requested. Refused with 400 when a volume is not one the series lists (checked only once the volumes are listed), and with 409 when a volume is in the library, downloading, or asked for by a request that is not declined or completed, or when such a request asks for the whole series. More volumes of a series are requested later in a request of their own. Age limits, quotas and approval rules are the same as for a whole series.
                serverId:
                  type: number
                profileId:
                  type: number
                rootFolder:
                  type: string
                languageProfileId:
                  type: number
                userId:
                  type: number
                  nullable: true
                ignoreQuota:
                  type: boolean
                  example: false
                  description: If true, this request will not count against the user's quota. Requires MANAGE_REQUESTS permission.
              required:
                - mediaType
                - mediaId
      responses:
        '201':
          description: Succesfully created the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
  /request/discography:
    post:
      summary: Request albums of an artist's discography
      description: |
        Requests the given albums of an artist in one go, one music request per album, the way `POST /request` requests a single album. The `REQUEST` or `REQUEST_MUSIC` permission is required. Albums that are already requested, available or blocklisted are skipped, and albums that cannot be requested are reported as failed while the rest are still requested. A request can include at most 100 albums, and is refused as a whole when it needs more music requests than the user's quota has left, unless `ignoreQuota` is set. One summary notification is sent for the request instead of one per album.
      tags:
        - request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                artistId:
                  type: string
                  description: MusicBrainz artist ID
                  example: a74b1b7f-71a5-4011-9441-d0b5e4122711
                mbIds:
                  type: array
                  description: MusicBrainz release group IDs of the albums to request, at most 100
                  items:
                    type: string
                    example: 1dc4c347-a1db-32aa-b14f-bc9cc507b843
                serverId:
                  type: number
                profileId:
                  type: number
                rootFolder:
                  type: string
                tags:
                  type: array
                  items:
                    type: number
                userId:
                  type: number
                  nullable: true
                ignoreQuota:
                  type: boolean
                  example: false
                  description: If true, these requests will not count against the user's quota. Requires MANAGE_REQUESTS permission.
                monitorNewReleases:
                  type: boolean
                  example: false
                  description: Has Lidarr monitor new albums of the artist once it is added. Requires MANAGE_REQUESTS permission. `mbIds` may be empty when this is set.
              required:
                - artistId
                - mbIds
      responses:
        '200':
          description: No album was requested, all of them were skipped or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRequestResponse'
        '201':
          description: At least one album was requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRequestResponse'
  /request/author-catalog:
    post:
      summary: Request works of an author
      description: |
        Requests the given works of an author in one go, one book request per work and format, the way `POST /request` requests a single book. The `REQUEST` or `REQUEST_BOOK` permission is required. Formats that are already requested, available or blocklisted are skipped, and works that cannot be requested are reported as failed while the rest are still requested. A request can include at most 100 requests, a work requested in both formats counting twice, and is refused as a whole when it needs more book requests than the user's quota has left, unless `ignoreQuota` is set. One summary notification is sent for the request instead of one per book.
      tags:
        - request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authorId:
                  type: string
                  description: OpenLibrary author ID
                  example: OL34184A
                olIds:
                  type: array
                  description: OpenLibrary work IDs of the books to request, at most 100 requests counting each format
                  items:
                    type: string
                    example: OL45804W
                format:
                  type: string
                  enum: [ebook, audiobook, both]
                  example: ebook
                language:
                  type: string
                  enum:
                    [
                      en,
                      es,
                      fr,
                      de,
                      it,
                      pt,
                      nl,
                      sv,
                      da,
                      'no',
                      fi,
                      pl,
                      ru,
                      ja,
                      zh,
                      ko,
                      any,
                    ]
                  example: en
                  description: ISO 639-1 code of the language to request the books in, or `any`. Only honored for users with the `MANAGE_REQUESTS` permission. Everyone else requests in their own language and a different value is ignored.
                userId:
                  type: number
                  nullable: true
                ignoreQuota:
                  type: boolean
                  example: false
                  description: If true, these requests will not count against the user's quota. Requires MANAGE_REQUESTS permission.
              required:
                - authorId
                - olIds
                - format
      responses:
        '200':
          description: No book was requested, all of them were skipped or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRequestResponse'
        '201':
          description: At least one book was requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRequestResponse'
  /request/count:
    get:
      summary: Gets request counts
      description: |
        Returns the number of requests by status including pending, approved, available, and completed requests.
      tags:
        - request
      responses:
        '200':
          description: Request counts returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  movie:
                    type: number
                  tv:
                    type: number
                  music:
                    type: number
                  book:
                    type: number
                  pending:
                    type: number
                  approved:
                    type: number
                  declined:
                    type: number
                  processing:
                    type: number
                  available:
                    type: number
                  completed:
                    type: number
  /request/{requestId}:
    get:
      summary: Get MediaRequest
      description: Returns a specific MediaRequest in a JSON object.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '200':
          description: Succesfully returns request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
    put:
      summary: Update MediaRequest
      description: Updates a specific media request and returns the request in a JSON object. Requires the `MANAGE_REQUESTS` permission.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          example: '1'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaType:
                  type: string
                  enum: [movie, tv, music, book, comic]
                seasons:
                  type: array
                  items:
                    type: number
                    minimum: 0
                episodes:
                  type: array
                  description: Requests only these episodes of each listed season. Seasons already on the request take the new episode list.
                  items:
                    $ref: '#/components/schemas/RequestedEpisodes'
                monitorMode:
                  type: string
                  enum: [seasons, future, current]
                  description: Switches the request between season, future only and current season monitoring. Keeps the current mode when omitted.
                is4k:
                  type: boolean
                  example: false
                serverId:
                  type: number
                profileId:
                  type: number
                rootFolder:
                  type: string
                languageProfileId:
                  type: number
                language:
                  type: string
                  enum:
                    [
                      en,
                      es,
                      fr,
                      de,
                      it,
                      pt,
                      nl,
                      sv,
                      da,
                      'no',
                      fi,
                      pl,
                      ru,
                      ja,
                      zh,
                      ko,
                      any,
                    ]
                  example: en
                  description: Books only. Changes the language the book is requested in. Only users with the `MANAGE_REQUESTS` permission can change it, it is ignored for everyone else.
                userId:
                  type: number
                  nullable: true
              required:
                - mediaType
      responses:
        '200':
          description: Succesfully updated request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
        '409':
          description: Only pending requests can be modified
    delete:
      summary: Delete request
      description: Removes a request. If the user has the `MANAGE_REQUESTS` permission, any request can be removed. Otherwise, only pending requests can be removed.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '204':
          description: Succesfully removed request
  /request/{requestId}/retry:
    post:
      summary: Retry failed request
      description: |
        Retries a request by resending requests to Sonarr or Radarr.

        Requires the `MANAGE_REQUESTS` permission or `ADMIN`.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          schema:
            type: string
            example: '1'
      responses:
        '200':
          description: Retry triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
        '409':
          description: Only failed requests can be retried
  /request/{requestId}/{status}:
    post:
      summary: Update a request's status
      description: |
        Updates a request's status to approved or declined. Also returns the request in a JSON object.

        Requires the `MANAGE_REQUESTS` permission or `ADMIN`.
      tags:
        - request
      parameters:
        - in: path
          name: requestId
          description: Request ID
          required: true
          schema:
            type: string
            example: '1'
        - in: path
          name: status
          description: New status
          required: true
          schema:
            type: string
            enum: [approve, decline]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Shown to the requester when a request is declined.
      responses:
        '200':
          description: Request status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaRequest'
        '400':
          description: Status must be approve or decline
        '409':
          description: Only pending requests can be approved or declined
  /music/{musicId}:
    get:
      summary: Get album details
      description: Returns album details from MusicBrainz in a JSON object, with its cover, track list and request status.
      tags:
        - music
      parameters:
        - in: path
          name: musicId
          required: true
          description: MusicBrainz release group ID
          schema:
            type: string
            example: 1dc4c347-a1db-32aa-b14f-bc9cc507b843
      responses:
        '200':
          description: Album details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicDetails'
  /nobookends/directory:
    get:
      summary: Answer the NoBookEnds directory check
      description: While Allseerr registers with the NoBookEnds directory, the directory calls this with the code Allseerr sent it, to check the address belongs to this Allseerr. Answers only for a code made in the last 2 minutes that is still waiting, and 404 otherwise.
      security: []
      tags:
        - nobookends
      parameters:
        - in: query
          name: nonce
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The code is waiting
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce:
                    type: string
                  title:
                    type: string
                    description: The application title
                    example: Allseerr
        '404':
          description: Unknown or expired code
  /nobookends/status:
    get:
      summary: Get what NoBookEnds may offer
      description: Returns the Allseerr version and which features the NoBookEnds app may offer the signed in user, so it can hide what is turned off or not allowed. Works with the personal key from the connect link.
      tags:
        - nobookends
      responses:
        '200':
          description: Status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: 0.1.0
                  commitTag:
                    type: string
                  applicationTitle:
                    type: string
                    example: Allseerr
                  user:
                    type: object
                    properties:
                      id:
                        type: number
                        example: 1
                      displayName:
                        type: string
                        example: Dan
                  books:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Whether Chaptarr or LazyLibrarian is set up
                      service:
                        type: string
                        nullable: true
                        enum: [chaptarr, talearr, lazylibrarian, null]
                        description: Where book requests go, null while books are off
                      recordings:
                        type: boolean
                        description: Whether other recordings of an audiobook can be requested (`recording` on `POST /request`), which only Talearr offers
                      audiobookVersions:
                        type: string
                        enum: [both, unabridged, abridged, requester]
                        description: Talearr only. The Audiobook Versions setting. With `requester`, an audiobook request may pick `audiobookVersion`. With `both`, the abridged recording is asked for along with the audiobook.
                      defaultAudiobookVersion:
                        type: string
                        enum: [unabridged, abridged, both]
                        description: Talearr only. The version an audiobook request picks first when the requester may choose one.
                      canRequest:
                        type: boolean
                        description: Whether the user may request books
                      autoApprove:
                        type: boolean
                        description: Whether the user's book requests are approved right away
                      defaultFormat:
                        type: string
                        enum: [ebook, audiobook, both]
                        description: Format the request dialog picks first
                      quota:
                        type: object
                        nullable: true
                        description: The user's book request quota, the same count `POST /request` enforces. Null when the user may request books without a limit. Ebook and audiobook requests share one quota, so a book requested in both formats counts twice; there is no quota per format.
                        properties:
                          limit:
                            type: number
                            description: Requests allowed in the period
                            example: 5
                          days:
                            type: number
                            nullable: true
                            description: Length of the period in days, null when every request ever made counts
                            example: 7
                          used:
                            type: number
                            description: Requests made in the period, declined ones not counted
                            example: 2
                          remaining:
                            type: number
                            example: 3
                          restricted:
                            type: boolean
                            description: Whether the quota is used up, so book requests are refused
                  issues:
                    type: object
                    properties:
                      canCreate:
                        type: boolean
                        description: Whether the user may report issues
                  requests:
                    type: object
                    properties:
                      canManage:
                        type: boolean
                        description: Whether the user may approve, decline and edit the requests of all users (the Manage Requests or Admin permission)
                  downloads:
                    type: object
                    properties:
                      canManage:
                        type: boolean
                        description: Whether the user may list and fix stuck book downloads with `/nobookends/attention` and the `/media/{mediaId}/arr` actions (the Manage Requests or Admin permission, with Chaptarr as the book service)
                  audiobookshelf:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      url:
                        type: string
                        nullable: true
                        description: Public Audiobookshelf address
                        example: https://books.example.com
                      itemLinks:
                        type: boolean
                        description: Whether book details carry the Audiobookshelf item ids, which needs an Audiobookshelf API key
                  openInNoBookEnds:
                    type: boolean
                    description: Whether book pages offer to open books in NoBookEnds
                  nobookendsSync:
                    type: object
                    description: The NoBookEnds Sync server to fetch Listen and Read alignments from. Only present while an admin enabled it and set its public URL.
                    properties:
                      url:
                        type: string
                        description: Public address of the Sync server, without a trailing slash
                        example: https://sync.example.com
        '403':
          description: Not signed in
  /nobookends/attention:
    get:
      summary: List stuck book downloads
      description: |
        Lists the book downloads Chaptarr cannot finish by itself, the ones the "Download Needs Attention" notification reports, newest first. Chaptarr's queue is read live (answers are kept for 15 seconds); downloads stuck for less than 10 minutes are left out, as they may still import by themselves. Empty when LazyLibrarian is the book service or Chaptarr does not answer.

        Requires the `MANAGE_REQUESTS` permission. Works with a personal key.
      tags:
        - nobookends
      responses:
        '200':
          description: Stuck downloads
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: Identifies the download for the dismiss endpoint
                          example: chaptarr:0:SABnzbd_nzo_a1b2c3d4:importblocked
                        mediaId:
                          type: number
                          nullable: true
                          description: Allseerr media ID, for the `/media/{mediaId}/arr` actions. Null when the book is not in Allseerr.
                          example: 42
                        olId:
                          type: string
                          nullable: true
                          description: OpenLibrary work ID, for `GET /book/{bookId}`
                          example: OL900001W
                        title:
                          type: string
                          example: The Lantern Keeper
                        author:
                          type: string
                          nullable: true
                          example: Jane Example
                        format:
                          type: string
                          nullable: true
                          enum: [ebook, audiobook]
                        reason:
                          type: string
                          nullable: true
                          description: What Chaptarr says is wrong, its first status message
                          example: No supported audio or ebook files were found in /downloads/complete/books/The.Lantern.Keeper
                        state:
                          type: string
                          description: Why the download counts as stuck, its Chaptarr state (importblocked, importfailed, failedpending, failed) or status (warning, error)
                          example: importblocked
                        since:
                          type: string
                          format: date-time
                          description: When Allseerr first saw the download stuck
                        downloadTitle:
                          type: string
                          description: Name of the release in the download client
                          example: Jane.Example.The.Lantern.Keeper.Unabridged.M4B
                        requesters:
                          type: array
                          description: Display names of the users still waiting for this format
                          items:
                            type: string
        '403':
          description: Not allowed to manage requests
  /nobookends/attention/{key}/dismiss:
    post:
      summary: Remove a stuck book download and search again
      description: |
        Removes the download from Chaptarr's queue and its download client, blocklists its release unless `blocklist=false`, then starts a new automatic search for the book's format (as `POST /media/{mediaId}/arr/search` does when the book is in Allseerr). The removal stands when the search cannot be started; `searchError` then says why.

        Requires the `MANAGE_REQUESTS` permission. Works with a personal key.
      tags:
        - nobookends
      parameters:
        - in: path
          name: key
          required: true
          description: Key of the download from `GET /nobookends/attention`, URL encoded
          schema:
            type: string
            example: chaptarr:0:SABnzbd_nzo_a1b2c3d4:importblocked
        - in: query
          name: blocklist
          required: false
          description: Blocklist the release so it is not grabbed again
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: The download was removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: boolean
                  blocklisted:
                    type: boolean
                  searched:
                    type: boolean
                    description: Whether a new search was started
                  searchError:
                    type: string
                    description: Why the new search could not be started
        '400':
          description: Invalid download key
        '403':
          description: Not allowed to manage requests
        '404':
          description: The download is no longer stuck, or its Chaptarr server is not set up
        '502':
          description: Chaptarr returned an error
  /nobookends/reading-apps:
    get:
      summary: Get the user's reading apps for NoBookEnds
      description: The same states as the user's Reading apps settings. Works with the personal key from the connect link and needs no request permission, so people who can only read and listen can use it.
      tags:
        - nobookends
      responses:
        '200':
          description: The reading apps
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/NoBookEndsReadingApp'
        '403':
          description: Not signed in
  /nobookends/reading-apps/{app}/connect:
    post:
      summary: Sign NoBookEnds in to a reading app
      description: |
        For the key's user: sets up their account when an admin or the default for Plex users gave them the app (it never gives access), then answers with what NoBookEnds signs in with, without a password where the app allows it:

        - Audiobookshelf 2.26 and later: `token`, an Audiobookshelf API key named "NoBookEnds (via Allseerr)" made for the user. Send it as `Authorization: Bearer {token}`.
        - Kavita: `apiKey`, a Kavita auth key named "NoBookEnds (via Allseerr)" on the user's account, for `POST /api/Plugin/authenticate?apiKey=...` or OPDS. Kavita only lets people make their own keys, so for an account Allseerr did not just make, Allseerr gives it a new password first and returns it.
        - Komga and older Audiobookshelf: `password`, a new password.

        A password is never changed for an account the person had before Allseerr linked it: where a key cannot be made without changing it (Kavita, Komga, older Audiobookshelf), connect answers 409 and the person signs in with their own password. Keys are stored sealed with AES-256-GCM.

        Each device gets the same key while it works; one that stopped working is replaced. `password` is only present when Allseerr just made or changed the password; show it to the user once. An app admin's password is never changed. At most 10 tries per app in 15 minutes.
      tags:
        - nobookends
      parameters:
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      responses:
        '200':
          description: How to sign in
          content:
            application/json:
              schema:
                type: object
                required: [app, serverUrl, username]
                properties:
                  app:
                    type: string
                    enum: [audiobookshelf, kavita, komga]
                  serverUrl:
                    type: string
                    description: The app's public address
                    example: https://abs.example.com
                  username:
                    type: string
                    example: reader
                  token:
                    type: string
                    description: Audiobookshelf API key
                  apiKey:
                    type: string
                    description: Kavita auth key
                  password:
                    type: string
                    description: A password Allseerr just made or changed, shown once
        '403':
          description: The user does not have access to the app
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: The app is not connected
        '409':
          description: The account cannot be set up or signed in to right now, or it is an app admin account
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          description: Too many tries
  /nobookends/reading-apps/{app}/request-access:
    post:
      summary: Ask the admins for access to a reading app
      description: Like asking from the Reading apps settings. Asking again does not notify the admins again.
      tags:
        - nobookends
      parameters:
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      responses:
        '200':
          description: The app's state, `requested` unless the user already has access
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    $ref: '#/components/schemas/ReadingAppState'
  /nobookends/item/{absItemId}:
    get:
      summary: Get the book of an Audiobookshelf item
      description: |
        Returns the book an Audiobookshelf library item is of, among the books Allseerr knows, with its request status per format. Items are remembered once a book page or the Chaptarr scan finds the book in the library, so known items answer from the database.

        With `title` (and optionally `author`), an unknown item is looked for: books with that title Allseerr knows are looked up in Audiobookshelf the way book pages do, which may take a couple of seconds. Works with the personal key from the connect link.
      tags:
        - nobookends
      parameters:
        - in: path
          name: absItemId
          required: true
          description: Audiobookshelf library item ID
          schema:
            type: string
            example: li_8a3k2m9x4q7w1p5z
        - in: query
          name: title
          required: false
          description: Title of the item, used to find an item Allseerr has not seen yet
          schema:
            type: string
            example: Fantastic Mr Fox
        - in: query
          name: author
          required: false
          description: Author of the item, narrows the title search
          schema:
            type: string
            example: Roald Dahl
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                type: object
                properties:
                  olId:
                    type: string
                    description: OpenLibrary work ID, for `GET /book/{bookId}`
                    example: OL45804W
                  format:
                    type: string
                    enum: [ebook, audiobook]
                    description: Format the item is of the book
                  mediaId:
                    type: number
                    description: Allseerr media ID, for `POST /issue`
                    example: 42
                  title:
                    type: string
                    nullable: true
                    description: Title of the work in OpenLibrary, null when it could not be fetched
                    example: Fantastic Mr Fox
                  status:
                    type: number
                    description: Availability of the ebook. 1 = `UNKNOWN`, 2 = `PENDING`, 3 = `PROCESSING`, 4 = `PARTIALLY_AVAILABLE`, 5 = `AVAILABLE`, 6 = `BLOCKLISTED`, 7 = `DELETED`
                    example: 5
                  statusAudio:
                    type: number
                    description: Availability of the audiobook, with the same values as `status`
                    example: 1
                  recordings:
                    type: array
                    description: Talearr only, once the audiobook is available there and Talearr answered. The recordings Talearr keeps of the audiobook, the primary one first.
                    items:
                      $ref: '#/components/schemas/BookRecording'
                  canRequestRecording:
                    type: boolean
                    description: Talearr only. Whether the user may request another recording now (`recording` on `POST /request`).
                  canRequestUnabridged:
                    type: boolean
                    description: Talearr only. Whether the user may request the unabridged recording now. False when the library has it, Talearr knows no unabridged edition or it was requested already.
                  canRequestAbridged:
                    type: boolean
                    description: Talearr only. Whether the user may request the abridged recording now (`recording` `abridged` on `POST /request`), such as when the library has the unabridged one. False when the library has an abridged recording, Talearr knows no abridged edition or it was requested already. Requests without `recording` still follow Talearr's grab policy, which picks the unabridged reading by default.
                  recordingRequests:
                    type: array
                    description: The recording requests made for the book, newest first
                    items:
                      $ref: '#/components/schemas/RecordingRequestSummary'
        '400':
          description: Invalid item ID
        '403':
          description: Not signed in
        '404':
          description: No book Allseerr knows has this item
  /book/{bookId}:
    get:
      summary: Get book details
      description: Returns book details from OpenLibrary in a JSON object, with its cover, subjects and request status. Merged works resolve to the work they were merged into.
      tags:
        - books
      parameters:
        - in: path
          name: bookId
          required: true
          description: OpenLibrary work ID
          schema:
            type: string
            example: OL45804W
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetails'
  /book/{bookId}/recordings:
    get:
      summary: Get the recordings of a book's audiobook
      description: |
        Returns the recordings Talearr keeps of the book's audiobook (the abridged and unabridged readings, other narrators), the audiobook editions that could become one, the recording requests made for the book and what the user may still ask for. Talearr is asked each time. With another book service, or before the audiobook is available in Talearr, `supported` is false and `reason` says why.
      tags:
        - books
      parameters:
        - in: path
          name: bookId
          required: true
          description: OpenLibrary work ID
          schema:
            type: string
            example: OL45804W
      responses:
        '200':
          description: The recordings of the book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookRecordings'
        '403':
          description: Not signed in
        '404':
          description: Invalid work ID
  /book/{bookId}/audiobook:
    get:
      summary: Get audiobook availability of a book
      description: Returns whether Audible lists an audiobook edition of the book, in the marketplace of the discover region. Answers are cached, and exists is null when Audible could not be asked.
      tags:
        - books
      parameters:
        - in: path
          name: bookId
          required: true
          description: OpenLibrary work ID
          schema:
            type: string
            example: OL45804W
      responses:
        '200':
          description: Audiobook availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudiobookAvailability'
  /book/audiobook-availability:
    post:
      summary: Get audiobook availability of several books
      description: Returns whether Audible lists audiobook editions of up to 50 books, keyed by OpenLibrary work ID. Books with an invalid ID or no title are left out.
      tags:
        - books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                books:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      olId:
                        type: string
                        example: OL45804W
                      title:
                        type: string
                        example: Fantastic Mr Fox
                      author:
                        type: string
                        example: Roald Dahl
                    required:
                      - olId
                      - title
              required:
                - books
      responses:
        '200':
          description: Audiobook availability by OpenLibrary work ID
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/AudiobookAvailability'
  /book/{bookId}/ebook:
    get:
      summary: Get ebook availability of a book
      description: Returns whether Google Books lists an ebook edition of the book, in the country of the discover region. Answers are saved and asked again after 90 days when an ebook was found, after 14 days otherwise. exists is null when no Google Books API key is set or Google could not be asked.
      tags:
        - books
      parameters:
        - in: path
          name: bookId
          required: true
          description: OpenLibrary work ID
          schema:
            type: string
            example: OL45804W
      responses:
        '200':
          description: Ebook availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EbookAvailability'
  /book/ebook-availability:
    post:
      summary: Get ebook availability of several books
      description: Returns whether Google Books lists ebook editions of up to 50 books, keyed by OpenLibrary work ID. Books with an invalid ID or no title are left out. Without a Google Books API key, every book reports null and Google is not asked.
      tags:
        - books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                books:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      olId:
                        type: string
                        example: OL17930368W
                      title:
                        type: string
                        example: Atomic Habits
                      author:
                        type: string
                        example: James Clear
                    required:
                      - olId
                      - title
              required:
                - books
      responses:
        '200':
          description: Ebook availability by OpenLibrary work ID
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/EbookAvailability'
  /comic/status:
    get:
      summary: Get whether comics can be requested
      description: Comics and manga can be requested while book requests go to Talearr and Talearr's comics library answers. The answer is kept for a minute. `reason` is `notTalearr`, `noServer` or `unavailable` when they cannot.
      tags:
        - comics
      responses:
        '200':
          description: Whether comics are on
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  reason:
                    type: string
                    enum: [notTalearr, noServer, unavailable]
                  message:
                    type: string
  /comic/search:
    get:
      summary: Search for comic and manga series
      description: Searches Talearr's comics lookup (AniList and Hardcover). Without a kind both kinds are searched. Answers 404 while comics are off.
      tags:
        - comics
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
            example: One Piece
        - in: query
          name: kind
          schema:
            type: string
            enum: [manga, comic]
      responses:
        '200':
          description: Matching series
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComicResult'
                  notices:
                    type: array
                    description: Plain notes from Talearr, such as a metadata source being down
                    items:
                      type: string
  /comic/library:
    get:
      summary: List the requested comic and manga series
      description: The series requested through Allseerr, newest first. Answers 404 while comics are off.
      tags:
        - comics
      responses:
        '200':
          description: Requested series
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComicResult'
  /comic/{comicId}:
    get:
      summary: Get comic or manga series details
      description: Returns what Talearr's lookup said of the series when it was last found by a search, its request status and what Talearr's library holds of it. While comics are on, Talearr's preview of the series adds its genres, banner and volumes and refreshes the saved facts; it is kept for six hours, and the saved facts are shown alone when Talearr has no preview of it.
      tags:
        - comics
      parameters:
        - in: path
          name: comicId
          required: true
          description: Comic ID, al-<AniList ID> or hc-<Hardcover series ID>
          schema:
            type: string
            example: al-30013
      responses:
        '200':
          description: Series details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComicDetails'
        '404':
          description: Unknown comic ID, or a series no search has found
