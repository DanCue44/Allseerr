    AudiobookshelfSettings:
      type: object
      properties:
        url:
          type: string
          nullable: true
          description: Public Audiobookshelf address, linked from available books
          example: 'https://books.example.com'
        libraryId:
          type: string
          nullable: true
          description: Audiobookshelf library searched for a book's title. Without it the link opens Audiobookshelf's home page.
          example: '3f2b8c1e-6a4d-4e9b-8c7a-1d2e3f4a5b6c'
        ebookLibraryId:
          type: string
          nullable: true
          description: Audiobookshelf library holding the ebooks, when they are kept apart from the audiobooks. Without it ebooks are searched for in the main library.
          example: '9e8d7c6b-5a4f-4e3d-9c2b-1a0f9e8d7c6b'
        apiKey:
          type: string
          nullable: true
          description: Optional. Only used to list the libraries in the settings.
        showNoBookEnds:
          type: boolean
          description: Offer to open available books in the NoBookEnds app. Needs the API key, which finds the book in the library. On unless set to false.
          example: true
        adminApiKeySet:
          type: boolean
          readOnly: true
          description: Whether an admin API key is saved. The key itself is never returned.
        adminApiKey:
          type: string
          writeOnly: true
          description: Optional. API token of an Audiobookshelf user allowed to update, only used to match authors so Audiobookshelf fetches their photos. Left out keeps the saved key, empty removes it. Without it, authors are not matched.
        authorMatchRegion:
          type: string
          enum: [us, ca, uk, au, fr, de, jp, it, in, es]
          description: Audible region authors are matched in. us when unset.
          example: us
