        - in: path
          name: tmdbId
          description: TMDB id, or the MusicBrainz release group id of an album or the OpenLibrary work id of a book. The MusicBrainz artist id of a followed artist, or the OpenLibrary author id of a followed author.
          required: true
          example: '1'
          schema:
            type: string
        - in: query
          name: mediaType
          required: true
          schema:
            type: string
            enum:
              - movie
              - tv
              - music
              - book
              - artist
              - author
