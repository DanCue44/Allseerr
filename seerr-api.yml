  /favorite:
    get:
      summary: Get favorites
      description: |
        Returns the favorite movies, series, albums and books of the current user, newest first. Viewing another user's favorites requires the `MANAGE_REQUESTS` or `WATCHLIST_VIEW` permission.
      tags:
        - favorite
      parameters:
        - in: query
          name: page
          schema:
            type: number
            example: 1
            default: 1
        - in: query
          name: userId
          schema:
            type: number
            example: 1
        - in: query
          name: tmdbId
          schema:
            type: number
            example: 550
        - in: query
          name: mbId
          schema:
            type: string
            example: 1dc4c347-a1db-32aa-b14f-bc9cc507b843
        - in: query
          name: olId
          schema:
            type: string
            example: OL45804W
        - in: query
          name: mediaType
          schema:
            type: string
            enum: [movie, tv, music, book]
      responses:
        '200':
          description: Favorites returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: number
                    example: 1
                  totalPages:
                    type: number
                    example: 1
                  totalResults:
                    type: number
                    example: 1
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Favorite'
    post:
      summary: Add a favorite
      description: Marks a movie, series, album or book as a favorite of the current user. Movies and series are named by tmdbId, albums by mbId and books by olId.
      tags:
        - favorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tmdbId:
                  type: number
                  example: 550
                mbId:
                  type: string
                  example: 1dc4c347-a1db-32aa-b14f-bc9cc507b843
                olId:
                  type: string
                  example: OL45804W
                mediaType:
                  type: string
                  enum: [movie, tv, music, book]
              required:
                - mediaType
      responses:
        '201':
          description: Favorite added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
        '409':
          description: Already a favorite
  /favorite/{tmdbId}:
    delete:
      summary: Remove a favorite
      description: Removes a movie, series, album or book from the current user's favorites.
      tags:
        - favorite
      parameters:
        - in: path
          name: tmdbId
          description: TMDB id, or the MusicBrainz release group id of an album or the OpenLibrary work id of a book
          required: true
          example: '550'
          schema:
            type: string
        - in: query
          name: mediaType
          required: true
          schema:
            type: string
            enum: [movie, tv, music, book]
