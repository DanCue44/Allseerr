                $ref: '#/components/schemas/UserSettings'
  /user/{userId}/settings/tour:
    post:
      summary: Record the guided tour as seen
      description: Stores the version of the guided tour the current user has seen, so the tour is shown once per user on any device. Only the user themselves can update it.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                  minimum: 0
                  example: 1
              required:
                - version
      responses:
        '200':
          description: Tour version stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  tourVersion:
                    type: integer
                    example: 1
  /user/{userId}/settings/api-key:
    get:
      summary: Get personal API key status
      description: Returns whether the user has a personal API key. The key itself is never returned. Requires `MANAGE_USERS` permission if viewing other users.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Personal API key status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasApiKey:
                    type: boolean
                    example: true
                  createdAt:
                    type: string
                    nullable: true
                    example: '2026-10-08T05:00:00.000Z'
    post:
      summary: Generate a personal API key
      description: |
        Creates a new personal API key for the current user, replacing any existing key. The key is only returned once. Send it in the `X-Api-Key` header to act as this user.

        Only the user themselves can generate a key.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '201':
          description: Personal API key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                    example: 'asu_6p1x...'
                  createdAt:
                    type: string
                    example: '2026-10-08T05:00:00.000Z'
    delete:
      summary: Revoke a personal API key
      description: Revokes the user's personal API key. Requires `MANAGE_USERS` permission if revoking another user's key.
      tags:
        - users
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '204':
          description: Personal API key revoked
  /user/{userId}/settings/apps:
    get:
      summary: Get the user's reading apps
      description: |
        The reading apps Allseerr manages accounts in (Audiobookshelf, Kavita and Komga, when connected) and where the user stands in each. Every signed in user can use it, also without permission to request. Requires `MANAGE_USERS` permission if viewing other users. Passwords and keys are never returned.
      tags:
        - users
        - user-access
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: The reading apps
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReadingAppStatus'
                  readingApps:
                    $ref: '#/components/schemas/ReadingAppChoices'
        '403':
          description: Another user's apps, without `MANAGE_USERS`
  /user/{userId}/settings/apps/{app}/setup:
    post:
      summary: Set up the user's account in a reading app
      description: |
        Makes or links the user's account in an app an admin or the default for Plex users gave them. It never gives access. The password of a new account is returned once, and emailed when Allseerr emails app passwords. At most 10 tries per app in 15 minutes.
      tags:
        - users
        - user-access
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      responses:
        '200':
          description: The app's new state. When the app could not make the account, the state is `error`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    $ref: '#/components/schemas/ReadingAppStatus'
                  password:
                    $ref: '#/components/schemas/UserAccessNewPassword'
        '403':
          description: The user does not have access to the app
        '404':
          description: The app is not connected
        '429':
          description: Too many tries
  /user/{userId}/settings/apps/{app}/password:
    post:
      summary: Give the user a new password in a reading app
      description: Replaces the password of the user's ready account and returns it once. Only for accounts Allseerr made; the user's own linked account and an app admin's account are left alone (an admin can still change it in User Access). At most 10 tries per app in 15 minutes.
      tags:
        - users
        - user-access
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      responses:
        '200':
          description: The new password, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccessNewPassword'
        '403':
          description: The user does not have access to the app
        '409':
          description: The account is not set up yet, is an app admin, or the app could not change the password
        '429':
          description: Too many tries
  /user/{userId}/settings/apps/{app}/request-access:
    post:
      summary: Ask the admins for access to a reading app
      description: Notifies the admins who manage users (Reading App Access Requests notifications) and shows the ask in the User Access people list. Asking again does not notify again. It gives nothing by itself.
      tags:
        - users
        - user-access
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      responses:
        '200':
          description: The app's state, `requested` unless the user already has access
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    $ref: '#/components/schemas/ReadingAppStatus'
  /user/{userId}/settings/nobookends:
    get:
      summary: Get NoBookEnds connection status
      description: Returns whether the user connected the NoBookEnds app, and the devices it is connected on. The keys are never returned. Requires `MANAGE_USERS` permission if viewing other users.
      tags:
        - users
        - nobookends
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Connection status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    description: Whether books and Audiobookshelf are set up, so the app can be connected
                    example: true
                  connected:
                    type: boolean
                    description: Whether NoBookEnds is connected on any device
                    example: true
                  createdAt:
                    type: string
                    nullable: true
                    description: When the newest device connected
                    example: '2026-10-13T05:00:00.000Z'
                  devices:
                    type: array
                    description: The devices NoBookEnds is connected on, newest first
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 3
                        label:
                          type: string
                          nullable: true
                          description: The device name the app sent when it connected
                          example: 'iPhone 16'
                        createdAt:
                          type: string
                          example: '2026-10-19T05:00:00.000Z'
                        lastUsedAt:
                          type: string
                          nullable: true
                          description: When the app last used the key, saved at most about once an hour
                          example: '2026-10-19T06:00:00.000Z'
                  applicationUrlMissing:
                    type: boolean
                    description: True when no Application URL is set and Allseerr was opened at a home address (localhost, a private IP or a local name), which the app could not reach away from home. A connect link can only be made once the Application URL is set.
                    example: false
    post:
      summary: Connect NoBookEnds on a device
      description: |
        Creates a personal API key for the NoBookEnds app on one more device and returns it with a link that sets the app up in one tap, and the app URL that `/nobookends/connect` hands the key back to the app with. The key is only returned once. Devices connected before keep working; past 10 devices the oldest are removed. It is separate from the key at `/user/{userId}/settings/api-key`, which it never replaces.

        Only the user themselves can create it, and books and Audiobookshelf must be set up. The Allseerr address in the link is the Application URL, or the address of this request when none is set and it is a public address.
      tags:
        - users
        - nobookends
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  type: string
                  description: A short name for the device, such as its model. Cut to 60 characters.
                  example: 'iPhone 16'
      responses:
        '201':
          description: Key and connect link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                    example: 'asu_6p1x...'
                  createdAt:
                    type: string
                    example: '2026-10-13T05:00:00.000Z'
                  connectUrl:
                    type: string
                    description: Opens the app, or its site when it is not installed. The Audiobookshelf address (`abs`), the Allseerr address (`allseerr`) and the key (`key`) are URL-encoded parameters in the fragment, which browsers never send to the site.
                    example: 'https://nobookends.com/open/connect#abs=https%3A%2F%2Fbooks.example.com&allseerr=https%3A%2F%2Fallseerr.example.com&key=asu_6p1x...'
                  appUrl:
                    type: string
                    description: The same parameters for the app's own scheme, which the sign in window the app opened closes on.
                    example: 'nobookends://connect#abs=https%3A%2F%2Fbooks.example.com&allseerr=https%3A%2F%2Fallseerr.example.com&key=asu_6p1x...'
                  device:
                    type: object
                    properties:
                      id:
                        type: number
                        example: 3
                      label:
                        type: string
                        nullable: true
                        description: The device name the app sent when it connected
                        example: 'iPhone 16'
                      createdAt:
                        type: string
                        example: '2026-10-19T05:00:00.000Z'
                      lastUsedAt:
                        type: string
                        nullable: true
                        description: When the app last used the key, saved at most about once an hour
                        example: '2026-10-19T06:00:00.000Z'
        '400':
          description: Books or Audiobookshelf are not set up, or no Application URL is set and Allseerr was opened at a home address
    delete:
      summary: Disconnect NoBookEnds
      description: Revokes the NoBookEnds keys of every device, which signs the app out of Allseerr everywhere. Requires `MANAGE_USERS` permission if revoking another user's keys.
      tags:
        - users
        - nobookends
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '204':
          description: NoBookEnds keys revoked
