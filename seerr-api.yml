  /settings/chaptarr/test:
    post:
      summary: Test Chaptarr configuration
      description: Tests if the Chaptarr configuration is valid. Returns quality profiles, metadata profiles, root folders and tags on success. Profiles and root folders carry their book format on Chaptarr.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                  example: '127.0.0.1'
                port:
                  type: number
                  example: 8789
                apiKey:
                  type: string
                  example: yourapikey
                useSsl:
                  type: boolean
                  example: false
                baseUrl:
                  type: string
              required:
                - hostname
                - port
                - apiKey
                - useSsl
      responses:
        '200':
          description: Successfully connected to Chaptarr instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  appName:
                    type: string
                    example: Chaptarr
                  isChaptarr:
                    type: boolean
                    description: False for other Readarr compatible servers, which have no per format profiles and root folders
                  isTalearr:
                    type: boolean
                    description: True when the server is Talearr, the Chaptarr fork
                  talearr:
                    type: object
                    description: What Talearr reports, only for Talearr
                    properties:
                      version:
                        type: string
                        example: 0.11.0
                      grabPolicy:
                        type: object
                        properties:
                          abridgedPolicy:
                            type: string
                            enum:
                              [
                                unabridgedOnly,
                                preferUnabridged,
                                any,
                                abridgedOnly,
                              ]
                          allowBundles:
                            type: boolean
                          failRejectedImports:
                            type: boolean
                          maxAutomaticRetries:
                            type: number
                      bookGrabPolicy:
                        type: boolean
                        description: Whether Talearr has a grab policy per book (`/api/v1/talearr/grabpolicy/book/{bookId}`), which Audiobook Versions uses to search for the abridged reading itself
                      metadataProblem:
                        type: string
                  profiles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        name:
                          type: string
                        profileType:
                          type: string
                          example: ebook
                  metadataProfiles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        name:
                          type: string
                        profileType:
                          type: number
                          description: 0 general, 1 audiobook, 2 ebook
                  rootFolders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        path:
                          type: string
                        folderType:
                          type: number
                          description: 0 mixed, 1 audiobook, 2 ebook
                        ebookQualityProfileId:
                          type: number
                        ebookMetadataProfileId:
                          type: number
                        audiobookQualityProfileId:
                          type: number
                        audiobookMetadataProfileId:
                          type: number
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServarrTag'
                  urlBase:
                    type: string
