          example: true
        url:
          type: string
          description: Public address of the NoBookEnds Sync server, which the apps open. Saved without a trailing slash.
          example: 'https://sync.example.com'
        internalUrl:
          type: string
          description: Optional. Address Allseerr reaches the Sync server at, when the public one does not work from the Allseerr server. Falls back to url.
          example: 'http://NoBookEnds-Sync:8000'
        adminTokenSet:
          type: boolean
          readOnly: true
          description: Whether an admin token is saved. The token itself is never returned.
        adminToken:
          type: string
          writeOnly: true
          description: The Sync server's ADMIN_TOKEN. Leave it out to keep the saved token, send an empty string to remove it.
