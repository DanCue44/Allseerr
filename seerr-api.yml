                      type: string
                    title:
                      type: string
                    username:
                      type: string
                    email:
                      type: string
                    thumb:
                      type: string
  /settings/metadatas:
    get:
      summary: Get Metadata settings
      description: Retrieves current Metadata settings.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataSettings'
    put:
      summary: Update Metadata settings
      description: Updates Metadata settings with the provided values.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataSettings'
      responses:
        '200':
          description: 'Values were successfully updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataSettings'
  /settings/metadatas/test:
    post:
      summary: Test Metadata Provider configuration
      description: Tests if the metadata provider configuration is valid. Returns a list of available languages on success.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tmdb:
                  type: boolean
                  example: true
                tvdb:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Succesfully connected to metadata provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Successfully connected to metadata provider'
  /settings/bazarr:
    get:
      summary: Get Bazarr settings
      description: Retrieves current Bazarr settings.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BazarrSettings'
    post:
      summary: Update Bazarr settings
      description: Updates Bazarr settings with the provided values after testing the connection.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BazarrSettings'
      responses:
        '200':
          description: 'Values were successfully updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BazarrSettings'
  /settings/lazylibrarian:
    get:
      summary: Get LazyLibrarian settings
      description: Retrieves current LazyLibrarian settings.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LazyLibrarianSettings'
    post:
      summary: Update LazyLibrarian settings
      description: Updates LazyLibrarian settings with the provided values after testing the connection. Saving without a hostname disables book requests.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LazyLibrarianSettings'
      responses:
        '200':
          description: 'Values were successfully updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LazyLibrarianSettings'
  /settings/audiobookshelf:
    get:
      summary: Get Audiobookshelf settings
      description: Retrieves the Audiobookshelf link settings. Settings saved by older versions in the LazyLibrarian settings are returned until new ones are saved.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudiobookshelfSettings'
    post:
      summary: Update Audiobookshelf settings
      description: Saves the Audiobookshelf link. The address is not tested, as it is the public address users open. Saving an empty URL removes the link.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudiobookshelfSettings'
      responses:
        '200':
          description: 'Values were successfully updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudiobookshelfSettings'
        '400':
          description: The URL is not an http or https address
  /settings/audiobookshelf/test:
    post:
      summary: Test Audiobookshelf configuration
      description: Checks that Audiobookshelf answers at the URL (GET /status, then /ping). With an API key, also lists its libraries.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  example: 'https://books.example.com'
                apiKey:
                  type: string
                  example: yourapikey
              required:
                - url
      responses:
        '200':
          description: Successfully connected to Audiobookshelf
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    description: Missing for servers without /status
                    example: '2.17.0'
                  libraries:
                    type: array
                    description: Only returned when an API key was given
                    items:
                      $ref: '#/components/schemas/AudiobookshelfLibrary'
  /user-access/apps:
    get:
      summary: List the apps user access manages
      description: Each app with whether it is connected and its libraries.
      tags:
        - user-access
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccessAppInfo'
  /user-access/people:
    get:
      summary: List everyone's app access
      tags:
        - user-access
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccessPerson'
  /user-access/people/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: number
    get:
      summary: Get a person's app access
      tags:
        - user-access
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccessPerson'
        '404':
          description: User not found
    post:
      summary: Update a person's app access
      description: Saves the person's age limit and app access, then links, updates or turns off their account in each app. Turning an app on only allows it and tells the person (Reading App Access Granted notifications); they set up the account themselves from their Reading apps settings. Use `POST /user-access/people/{userId}/apps/{app}/create` to make the account now.
      tags:
        - user-access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ageLimit:
                  type: string
                  nullable: true
                  enum: [none, teen, tween, kids, null]
                includeUnrated:
                  type: boolean
                apps:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      libraryIds:
                        type: array
                        nullable: true
                        items:
                          type: string
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccessUpdateResult'
        '400':
          description: The change is not valid
        '404':
          description: User not found
  /user-access/people/{userId}/sync:
    post:
      summary: Sync a person's app accounts again
      tags:
        - user-access
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccessUpdateResult'
  /user-access/people/{userId}/apps/{app}:
    delete:
      summary: Delete a person's account in an app
      description: Deletes the account in the app, with its reading progress, and takes away the person's access to the app.
      tags:
        - user-access
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccessPerson'
  /user-access/apps/{app}/accounts:
    get:
      summary: List an app's accounts for linking
      description: Every account in the app with the person it is linked to and, for the others, the person it likely belongs to (the same email, the same username ignoring case, or one username inside the other). Nothing is linked by this call.
      tags:
        - user-access
      parameters:
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      responses:
        '200':
          description: The accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    type: string
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        username:
                          type: string
                        email:
                          type: string
                          nullable: true
                        isAdmin:
                          type: boolean
                        linkedUserId:
                          type: number
                          nullable: true
                        linkedDisplayName:
                          type: string
                          nullable: true
                        suggestedUserId:
                          type: number
                          nullable: true
                        suggestedDisplayName:
                          type: string
                          nullable: true
        '400':
          description: The app is not connected
  /user-access/apps/{app}/accounts/{remoteUserId}/service:
    post:
      summary: Mark an app account as a service account or a person's
      description: Service accounts are never suggested, linked or renamed. Accounts named like Allseerr's own tools (allseerr, allseerr-match, talearr, nobookends-sync, appdev, appreview) and the account the app connection signs in with count as service accounts unless marked as a person's. `service` true marks it a service account, false a person's, null leaves it to those rules.
      tags:
        - user-access
      parameters:
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
        - in: path
          name: remoteUserId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service:
                  type: boolean
                  nullable: true
      responses:
        '200':
          description: The app's accounts, as GET /user-access/apps/{app}/accounts answers
  /user-access/renames:
    get:
      summary: List the accounts renamed to match Plex
      description: The latest renames, newest first, made while Keep app usernames the same as Plex is on (`matchPlexUsernames` in the user access settings). Each renamed person also gets a Reading App Username Changed notification.
      tags:
        - user-access
      responses:
        '200':
          description: The renames
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      type: number
                    displayName:
                      type: string
                    app:
                      type: string
                    from:
                      type: string
                    to:
                      type: string
                    date:
                      type: string
    delete:
      summary: Clear the list of renamed accounts
      tags:
        - user-access
      responses:
        '204':
          description: Cleared
  /user-access/people/{userId}/apps/{app}/link:
    post:
      summary: Link a person to an account they already have in an app
      description: Links the account and turns the app on for the person, with the libraries (and on Audiobookshelf the download permission) the account has now, so nothing it can see changes. While Keep app usernames the same as Plex is on, an Audiobookshelf or Kavita account is renamed to the person's Plex username unless another account has that name, which `warning` then says. The account keeps its password and is kept in line with the person's access from then on. With Kavita the account gets the person's email when they have a real one, as Kavita links people signing in with Allseerr by email; Kavita keeps the email of the account its admin key belongs to, which `warning` then says. Audiobookshelf links people by username, which signing in sends as the linked account's.
      tags:
        - user-access
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remoteUserId:
                  type: string
              required:
                - remoteUserId
      responses:
        '200':
          description: The person, with a warning when the email could not be set
        '404':
          description: Unknown person, app or account
        '409':
          description: The account is linked to someone else
  /user-access/people/{userId}/apps/{app}/unlink:
    post:
      summary: Stop managing a person's account in an app
      description: Unlinks the account without changing it in the app and turns the app off for the person, so the next sync does not link it again.
      tags:
        - user-access
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      responses:
        '200':
          description: The person
  /user-access/people/{userId}/apps/{app}/create:
    post:
      summary: Make a person's account in an app now
      description: Turning an app on only allows it, and the person sets up their account themselves. This makes the account now instead and returns its password once, for the admin to pass on.
      tags:
        - user-access
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      responses:
        '200':
          description: The person and the new password, when an account was made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccessUpdateResult'
        '400':
          description: The app is not turned on for the person
  /user-access/people/{userId}/apps/{app}/password:
    post:
      summary: Give a person a new password in an app
      tags:
        - user-access
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: number
        - in: path
          name: app
          required: true
          schema:
            type: string
            enum: [audiobookshelf, kavita, komga]
      responses:
        '200':
          description: The new password, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccessNewPassword'
        '400':
          description: The person has no account in the app
  /user-access/invites:
    get:
      summary: List invite links
      tags:
        - user-access
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccessInvite'
    post:
      summary: Make an invite link
      description: The link lets one person sign in with Plex, even without access to the Plex server, and gives them the apps, libraries and age limit named here. The link is returned only now.
      tags:
        - user-access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  nullable: true
                  description: Who the invite is for, shown to admins only
                days:
                  type: number
                  description: How long the link works, 7 days unless set, at most 90
                ageLimit:
                  type: string
                  nullable: true
                  enum: [none, teen, tween, kids, null]
                includeUnrated:
                  type: boolean
                apps:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      libraryIds:
                        type: array
                        nullable: true
                        items:
                          type: string
      responses:
        '201':
          description: The invite and its link
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    $ref: '#/components/schemas/UserAccessInvite'
                  link:
                    type: string
                  token:
                    type: string
        '400':
          description: The invite is not valid
  /user-access/invites/{id}:
    delete:
      summary: Revoke an invite link
      tags:
        - user-access
      parameters:
        - in: path
          name: id
