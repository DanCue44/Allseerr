  /removal:
    get:
      summary: Get removal requests
      description: |
        Returns removal requests in JSON format. Users without the `MANAGE_REQUESTS` permission only see their own.
      tags:
        - request
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 20
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: filter
          schema:
            type: string
            enum: [all, pending, approved, declined, failed]
            default: all
        - in: query
          name: mediaId
          schema:
            type: number
            nullable: true
            example: 1
      responses:
        '200':
          description: Removal requests returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/RemovalRequest'
    post:
      summary: Request removal of media
      description: |
        Asks for an available title to be removed from Radarr, Sonarr, Lidarr or LazyLibrarian, along with its files. A user with the `MANAGE_REQUESTS` permission must approve it.
      tags:
        - request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaId:
                  type: number
                  example: 1
                is4k:
                  type: boolean
                  example: false
                bookFormat:
                  type: string
                  enum: [ebook, audiobook, both]
                  description: Formats of a book to remove, both when omitted
                reason:
                  type: string
                  maxLength: 500
                  example: 'We finished watching it'
              required:
                - mediaId
      responses:
        '201':
          description: Removal request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovalRequest'
        '400':
          description: Only available media can be requested for removal
        '409':
          description: A removal request for this media already exists
  /removal/count:
    get:
      summary: Get pending removal request count
      description: |
        Returns the number of removal requests waiting for approval. Requires the `MANAGE_REQUESTS` permission.
      tags:
        - request
      responses:
        '200':
          description: Pending removal request count returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: number
                    example: 2
  /removal/{removalId}:
    delete:
      summary: Delete a removal request
      description: |
        Cancels a pending removal request. Users can cancel their own; the `MANAGE_REQUESTS` permission is needed for anyone else's.
      tags:
        - request
      parameters:
        - in: path
          name: removalId
          required: true
          schema:
            type: string
            example: '1'
      responses:
        '204':
          description: Removal request deleted
  /removal/{removalId}/{status}:
    post:
      summary: Approve or decline a removal request
      description: |
        Approving removes the title and its files from Radarr or Sonarr. Requires the `MANAGE_REQUESTS` permission.
      tags:
        - request
      parameters:
        - in: path
          name: removalId
          required: true
          schema:
            type: string
            example: '1'
        - in: path
          name: status
          required: true
          schema:
            type: string
            enum: [approve, decline]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Removal request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovalRequest'
        '409':
          description: The removal request is no longer pending
  /downloads:
    get:
      summary: List the downloads of every arr
      description: |
        Lists the queues of every Radarr, Sonarr (4K servers too), Lidarr and Chaptarr server in one list, failed and stuck downloads first. Downloads of media in Allseerr carry the media IDs, the target for the `/media/{mediaId}/arr` actions and the user who requested it. Answers are kept for 5 seconds. A server that does not answer is listed in `serverErrors`, the other servers are shown anyway.

        Requires the `MANAGE_REQUESTS` permission.
      tags:
        - downloads
      responses:
        '200':
          description: Downloads
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Identifies the download for the actions
                          example: radarr:0:123
                        service:
                          type: string
                          enum: [radarr, sonarr, lidarr, chaptarr]
                        serverId:
                          type: number
                        serverName:
                          type: string
                          example: Radarr
                        is4k:
                          type: boolean
                        mediaType:
                          type: string
                          enum: [movie, tv, music, ebook, audiobook]
                        title:
                          type: string
                          example: The Lantern Keeper
                        seasonNumber:
                          type: number
                        episodeNumbers:
                          type: array
                          items:
                            type: number
                        artistName:
                          type: string
                        authorName:
                          type: string
                        releaseTitle:
                          type: string
                        protocol:
                          type: string
                          enum: [usenet, torrent, unknown]
                        downloadClient:
                          type: string
                          example: NZBGet
                        indexer:
                          type: string
                        size:
                          type: number
                        sizeLeft:
                          type: number
                        progress:
                          type: number
                          description: From 0 to 1
                        timeLeft:
                          type: string
                          example: '00:12:30'
                        status:
                          type: string
                          enum:
                            [
                              downloading,
                              queued,
                              paused,
                              importing,
                              importPending,
                              completed,
                              warning,
                              failed,
                              stalled,
                            ]
                        statusMessages:
                          type: array
                          items:
                            type: string
                        errorMessage:
                          type: string
                        needsAttention:
                          type: boolean
                        added:
                          type: string
                          format: date-time
                        posterUrl:
                          type: string
                        backdropUrl:
                          type: string
                          description: Fanart for movies and series
                        quality:
                          type: string
                          example: Bluray-1080p
                        outputPath:
                          type: string
                          description: Where the download client puts the files
                        mediaId:
                          type: number
                        tmdbId:
                          type: number
                        olId:
                          type: string
                        requester:
                          type: object
                          properties:
                            id:
                              type: number
                            displayName:
                              type: string
                            avatar:
                              type: string
                        canSearch:
                          type: boolean
                  totals:
                    type: object
                    properties:
                      total:
                        type: number
                      downloading:
                        type: number
                      queued:
                        type: number
                      attention:
                        type: number
                  serverErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        service:
                          type: string
                        serverId:
                          type: number
                        serverName:
                          type: string
                        message:
                          type: string
                  updatedAt:
                    type: string
                    format: date-time
        '403':
          description: Not allowed to manage requests
  /downloads/count:
    get:
      summary: Count the downloads
      description: |
        The number of downloads and of the ones needing attention (failed, stalled or with a warning), for the navigation badge. Answers may be up to a minute old.

        Requires the `MANAGE_REQUESTS` permission.
      tags:
        - downloads
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  attention:
                    type: number
                  seedingAtRisk:
                    type: number
                    description: Seeding torrents at risk, 0 unless Talearr is the book service
        '403':
          description: Not allowed to manage requests
  /downloads/seeding:
    get:
      summary: List what Talearr seeds
      description: |
        The torrents Talearr's download client seeds, or should be seeding, with the seeded time against the tracker's minimum, and the private tracker account Talearr checks. Torrents of private trackers that will not meet the minimum, such as paused or errored ones, are `atRisk` with a `riskReason`. Answers are kept for 30 seconds. With stock Chaptarr or LazyLibrarian as the book service, or a Talearr without seeding, the answer is `{ "supported": false }`.

        Requires the `ADMIN` permission.
      tags:
        - downloads
      responses:
        '200':
          description: Seeding torrents
          content:
            application/json:
              schema:
                type: object
                required: [supported]
                properties:
                  supported:
                    type: boolean
                  generatedAt:
                    type: string
                    format: date-time
                    nullable: true
                  torrents:
                    type: array
                    items:
                      type: object
                      properties:
                        downloadId:
                          type: string
                          description: The hash in the download client
                        title:
                          type: string
                          example: Ali Hazelwood - Deep End.m4b
                        bookId:
                          type: number
                          nullable: true
                          description: The Talearr book, null when Talearr cannot match the torrent
                        bookTitle:
                          type: string
                          nullable: true
                        authorName:
                          type: string
                          nullable: true
                        mediaType:
                          type: string
                          enum: [audiobook, ebook, comic]
                          nullable: true
                          description: From Talearr, or from the file extension when Talearr has no book
                        indexer:
                          type: string
                          nullable: true
                        isFiller:
                          type: boolean
                          description: Seeded only to build ratio, not a library book
                          example: Example Tracker
                        isPrivateTracker:
                          type: boolean
                        downloadClient:
                          type: string
                          nullable: true
                        state:
                          type: string
                          enum:
                            [
                              seeding,
                              stalled,
                              queued,
                              paused,
                              checking,
                              error,
                              downloading,
                            ]
                        size:
                          type: number
                          description: Bytes
                        uploaded:
                          type: number
                          description: Bytes
                        ratio:
                          type: number
                        seedingSeconds:
                          type: number
                        requiredSeedingSeconds:
                          type: number
                          nullable: true
                          example: 259200
                        seedGoalSeconds:
                          type: number
                          nullable: true
                        requirementMet:
                          type: boolean
                        atRisk:
                          type: boolean
                        riskReason:
                          type: string
                          nullable: true
                          example: Paused before 72 h of seeding
                        addedAt:
                          type: string
                          format: date-time
                          nullable: true
                        completedAt:
                          type: string
                          format: date-time
                          nullable: true
                        mediaId:
                          type: number
                          description: The book in Allseerr, when it has the Talearr book
                        olId:
                          type: string
                        posterUrl:
                          type: string
                          description: The book's cover from Talearr
                        requester:
                          type: object
                          nullable: true
                          description: Who requested the book in this format, null when nobody did (such as filler torrents)
                          properties:
                            id:
                              type: number
                            displayName:
                              type: string
                            avatar:
                              type: string
                  summary:
                    type: object
                    properties:
                      total:
                        type: number
                      seeding:
                        type: number
                      atRisk:
                        type: number
                      privateUnsatisfied:
                        type: number
                  talearrUrl:
                    type: string
                    nullable: true
                    description: Talearr's public address from the book service settings
                  trackerAccount:
                    type: object
                    nullable: true
                    description: Null when Talearr checks no tracker account
                    properties:
                      userClass:
                        type: string
                        nullable: true
                      isVip:
                        type: boolean
                      unsatisfied:
                        type: number
                        nullable: true
                      unsatisfiedLimit:
                        type: number
                        nullable: true
                      wedges:
                        type: number
                        nullable: true
                      bonusPoints:
                        type: number
                        nullable: true
                      checkedAt:
                        type: string
                        format: date-time
                        nullable: true
        '403':
          description: Not an admin
        '502':
          description: Talearr did not answer or sent an answer that cannot be read
  /downloads/{downloadId}/search:
    post:
      summary: Search again for what a download is of
      description: |
        Starts a new search in the arr for the movie, the episodes, the album or the book format the download is of. The download itself stays in the queue.

        Requires the `MANAGE_REQUESTS` permission.
      tags:
        - downloads
      parameters:
        - in: path
          name: downloadId
          required: true
          schema:
            type: string
            example: radarr:0:123
      responses:
        '200':
          description: The search was started
        '400':
          description: Invalid download id
        '404':
          description: The download is no longer in the queue
        '409':
          description: The arr does not say what the download is of
        '502':
          description: The arr returned an error
  /downloads/{downloadId}/remove:
    post:
      summary: Remove a download from the queue
      description: |
        Removes the download from the arr's queue and, unless `removeFromClient` is false, from NZBGet or qBittorrent. With `blocklist`, its release is never grabbed again. With `search`, a new search is started after; the removal stands when it cannot be, and `searchError` says why.

        Requires the `MANAGE_REQUESTS` permission.
      tags:
        - downloads
      parameters:
        - in: path
          name: downloadId
          required: true
          schema:
            type: string
            example: radarr:0:123
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                removeFromClient:
                  type: boolean
                  default: true
                blocklist:
                  type: boolean
                  default: false
                search:
                  type: boolean
                  default: false
      responses:
        '200':
          description: The download was removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: boolean
                  blocklisted:
                    type: boolean
                  searched:
                    type: boolean
                  searchError:
                    type: string
        '400':
          description: Invalid download id
        '404':
          description: The download is no longer in the queue
        '502':
          description: The arr returned an error
  /rollover:
    get:
      summary: Get season rollovers
      description: |
        Returns the season rollovers of current season requests, newest first. Requires the `MANAGE_REQUESTS` permission.
      tags:
        - request
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [all, pending, kept, completed]
            default: all
        - in: query
          name: mediaId
          schema:
            type: number
            nullable: true
            example: 1
      responses:
        '200':
          description: Season rollovers returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeasonRollover'
  /rollover/{rolloverId}/{action}:
    post:
      summary: Keep or delete the older seasons of a season rollover
      description: |
        `keep` keeps every older season. `delete-now` ends the notice period for the seasons the request brought in, and `delete-all` also approves deleting the seasons that were already there. Deleting happens on the Sonarr scan, which is started right away. Requires the `MANAGE_REQUESTS` permission.
      tags:
        - request
      parameters:
        - in: path
          name: rolloverId
          required: true
          schema:
            type: string
            example: '1'
        - in: path
          name: action
          required: true
          schema:
            type: string
            enum: [keep, delete-now, delete-all]
      responses:
        '200':
          description: Season rollover updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonRollover'
        '409':
          description: The season rollover is no longer pending
  /issue:
    get:
      summary: Get all issues
