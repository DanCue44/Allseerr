  /settings/plex:
    get:
      summary: Get Plex settings
      description: Retrieves current Plex settings.
      tags:
        - settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlexSettings'
    post:
      summary: Update Plex settings
      description: |
        Tests the connection and saves the Plex settings only when it works. `ip` may hold a full URL
        such as `https://plex.example.com` or `http://192.168.1.5:32400`, which also sets the port and
        SSL. When the connection fails, other addresses on the same host are tried and the first that
        works is returned as `suggestion`, without being saved.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlexSettings'
      responses:
        '200':
          description: 'Values were successfully updated'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlexSettings'
        '400':
          description: The address could not be read, for example a URL with a sub path
        '500':
          description: Plex could not be reached. Nothing was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlexConnectionError'
  /settings/plex/library:
    get:
